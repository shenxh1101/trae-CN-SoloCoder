<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beijing 天气日历</title>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        h1 { text-align: center; color: #333; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 800px; margin: 0 auto; }
        .day-header { background: #333; color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; }
        .day { padding: 12px; text-align: center; min-height: 70px; display: flex; flex-direction: column; justify-content: center; color: white; font-weight: bold; border-radius: 5px; font-size: 13px; }
        .day .temp { font-size: 16px; margin-top: 2px; }
        .day .cond { font-size: 11px; margin-top: 2px; opacity: 0.9; }
        .empty { background: #e0e0e0; min-height: 40px; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 20px; height: 20px; border-radius: 3px; }
        .info { text-align: center; margin-top: 20px; color: #666; }
    </style>
</head>
<body>
    <h1>🌡️ Beijing 天气日历</h1>
    <div class="calendar">
        <div class="day-header">周一</div>
        <div class="day-header">周二</div>
        <div class="day-header">周三</div>
        <div class="day-header">周四</div>
        <div class="day-header">周五</div>
        <div class="day-header">周六</div>
        <div class="day-header">周日</div>
        <div class="day" style="background-color: rgb(255, 80, 55);">25<span class="temp">26.0°C</span><span class="cond">Sunny</span></div>
        <div class="day" style="background-color: rgb(143, 220, 68);">26<span class="temp">25.9°C</span><span class="cond">晴</span></div>
        <div class="day" style="background-color: rgb(228, 193, 55);">27<span class="temp">25.9°C</span><span class="cond">晴</span></div>
        <div class="day" style="background-color: rgb(103, 159, 148);">28<span class="temp">25.9°C</span><span class="cond">晴</span></div>
        <div class="day" style="background-color: rgb(50, 80, 255);">29<span class="temp">25.8°C</span><span class="cond">Sunny</span></div>

    </div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgb(50, 80, 255);"></div>
            <span>最低 25.8°C</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgb(180, 230, 55);"></div>
            <span>平均 25.9°C</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgb(255, 80, 55);"></div>
            <span>最高 26.0°C</span>
        </div>
    </div>
    <div class="info">
        <p>数据记录: 120 条 | 统计天数: 5 天</p>
        <p>生成时间: 2026-05-30 15:18:38</p>
    </div>
</body>
</html>
