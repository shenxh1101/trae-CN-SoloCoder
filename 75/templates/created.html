{% extends "base.html" %}

{% block title %}片段创建成功{% endblock %}

{% block content %}
<div class="message-page">
    <div class="success-icon">✓</div>
    <h2>片段创建成功！</h2>
    
    <div class="links-container">
        <div class="link-item">
            <label>访问链接：</label>
            <div class="link-row">
                <input type="text" value="{{ snippet_url }}" readonly class="link-input">
                <button class="btn btn-small copy-link" data-url="{{ snippet_url }}">复制</button>
            </div>
            <a href="{{ snippet_url }}" class="btn btn-primary">查看片段</a>
        </div>
        
        <div class="link-item warning">
            <label>删除链接（请妥善保存）：</label>
            <div class="link-row">
                <input type="text" value="{{ delete_url }}" readonly class="link-input">
                <button class="btn btn-small copy-link" data-url="{{ delete_url }}">复制</button>
            </div>
            <p class="hint">任何人访问此链接都可以删除该片段，请妥善保存</p>
        </div>
    </div>
    
    <a href="{{ url_for('index') }}" class="btn btn-secondary">返回首页</a>
</div>

<div class="toast" id="toast">已复制到剪贴板！</div>
{% endblock %}
