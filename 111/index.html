<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄罗斯方块双人对战</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="bg-grid"></div>
        <div class="bg-glow glow-1"></div>
        <div class="bg-glow glow-2"></div>

        <div class="start-menu" id="startMenu">
            <div class="menu-card">
                <h1 class="game-title">
                    <span class="title-blue">TETRIS</span>
                    <span class="title-divider">VS</span>
                    <span class="title-red">BATTLE</span>
                </h1>
                <p class="subtitle">俄罗斯方块双人对战</p>

                <div class="menu-section">
                    <label class="menu-label">游戏模式</label>
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="single">
                            <span class="mode-icon">🤖</span>
                            <span class="mode-text">单人对战AI</span>
                        </button>
                        <button class="mode-btn" data-mode="dual">
                            <span class="mode-icon">👥</span>
                            <span class="mode-text">双人对战</span>
                        </button>
                    </div>
                </div>

                <div class="menu-section">
                    <label class="menu-label">难度等级</label>
                    <div class="difficulty-buttons">
                        <button class="diff-btn" data-difficulty="easy">简单</button>
                        <button class="diff-btn active" data-difficulty="normal">普通</button>
                        <button class="diff-btn" data-difficulty="hard">困难</button>
                    </div>
                </div>

                <div class="menu-section">
                    <label class="menu-label">速度模式</label>
                    <div class="speed-buttons">
                        <button class="speed-btn active" data-speed="classic">经典速度</button>
                        <button class="speed-btn" data-speed="fast">高速模式</button>
                    </div>
                </div>

                <div class="menu-section">
                    <label class="menu-label">胜利行数: <span id="winLinesDisplay">20</span></label>
                    <input type="range" id="winLinesSlider" min="10" max="50" value="20" step="5" class="win-lines-slider">
                </div>

                <div class="menu-section">
                    <div class="records-display">
                        <div class="record-item">
                            <span class="record-label">🏆 玩家1最高连胜</span>
                            <span class="record-value" id="recordP1">0</span>
                        </div>
                        <div class="record-item">
                            <span class="record-label">🏆 玩家2最高连胜</span>
                            <span class="record-value" id="recordP2">0</span>
                        </div>
                        <div class="record-item">
                            <span class="record-label">🏆 AI最高连胜</span>
                            <span class="record-value" id="recordAI">0</span>
                        </div>
                    </div>
                </div>

                <button class="start-btn" id="startBtn">
                    <span class="btn-text">开始游戏</span>
                    <span class="btn-glow"></span>
                </button>

                <div class="controls-hint">
                    <p><span class="hint-key">WASD</span> 玩家1控制 | <span class="hint-key">方向键</span> 玩家2控制</p>
                    <p><span class="hint-key">空格</span> 硬降 | <span class="hint-key">P</span> 暂停 | <span class="hint-key">R</span> 重置</p>
                </div>
            </div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="player-panel player-1" id="player1Panel">
                <div class="panel-header">
                    <h2 class="player-name p1-name">玩家 1</h2>
                    <button class="sound-toggle" id="soundToggle1" title="音效开关">🔊</button>
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <span class="info-label">分数</span>
                        <span class="info-value" id="score1">0</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">行数</span>
                        <span class="info-value" id="lines1">0</span>
                    </div>
                    <div class="info-card next-piece-card">
                        <span class="info-label">下一个</span>
                        <canvas id="next1" width="100" height="100"></canvas>
                    </div>
                </div>

                <div class="game-board-wrapper">
                    <canvas id="board1" width="250" height="500"></canvas>
                    <div class="board-overlay" id="overlay1"></div>
                </div>

                <div class="streak-display">
                    <span>🔥 连胜: </span>
                    <span id="streak1">0</span>
                </div>
            </div>

            <div class="center-divider">
                <div class="divider-line"></div>
                <div class="divider-content">
                    <span class="vs-text">VS</span>
                    <div class="control-buttons">
                        <button class="control-btn" id="pauseBtn" title="暂停">⏸️</button>
                        <button class="control-btn" id="resetBtn" title="重置">🔄</button>
                        <button class="control-btn" id="menuBtn" title="菜单">🏠</button>
                    </div>
                    <div class="game-stats">
                        <div class="stat-item">
                            <span>目标</span>
                            <span id="targetLines">20</span>
                        </div>
                        <div class="stat-item">
                            <span>速度</span>
                            <span id="speedMode">经典</span>
                        </div>
                    </div>
                </div>
                <div class="divider-line"></div>
            </div>

            <div class="player-panel player-2" id="player2Panel">
                <div class="panel-header">
                    <h2 class="player-name p2-name" id="player2Name">玩家 2</h2>
                    <button class="sound-toggle" id="soundToggle2" title="音效开关">🔊</button>
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <span class="info-label">分数</span>
                        <span class="info-value" id="score2">0</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">行数</span>
                        <span class="info-value" id="lines2">0</span>
                    </div>
                    <div class="info-card next-piece-card">
                        <span class="info-label">下一个</span>
                        <canvas id="next2" width="100" height="100"></canvas>
                    </div>
                </div>

                <div class="game-board-wrapper">
                    <canvas id="board2" width="250" height="500"></canvas>
                    <div class="board-overlay" id="overlay2"></div>
                </div>

                <div class="streak-display">
                    <span>🔥 连胜: </span>
                    <span id="streak2">0</span>
                </div>
            </div>
        </div>

        <div class="virtual-controls" id="virtualControls">
            <div class="v-controls v-controls-left">
                <div class="v-row">
                    <button class="v-btn" data-player="1" data-action="rotate">⟳</button>
                </div>
                <div class="v-row">
                    <button class="v-btn" data-player="1" data-action="left">←</button>
                    <button class="v-btn" data-player="1" data-action="down">↓</button>
                    <button class="v-btn" data-player="1" data-action="right">→</button>
                </div>
                <div class="v-row">
                    <button class="v-btn v-btn-wide" data-player="1" data-action="drop">⬇ 硬降</button>
                </div>
            </div>
            <div class="v-controls v-controls-right">
                <div class="v-row">
                    <button class="v-btn" data-player="2" data-action="rotate">⟳</button>
                </div>
                <div class="v-row">
                    <button class="v-btn" data-player="2" data-action="left">←</button>
                    <button class="v-btn" data-player="2" data-action="down">↓</button>
                    <button class="v-btn" data-player="2" data-action="right">→</button>
                </div>
                <div class="v-row">
                    <button class="v-btn v-btn-wide" data-player="2" data-action="drop">⬇ 硬降</button>
                </div>
            </div>
        </div>

        <div class="victory-modal" id="victoryModal">
            <div class="victory-content">
                <div class="confetti-container" id="confettiContainer"></div>
                <h1 class="victory-title" id="victoryTitle">🎉 胜利! 🎉</h1>
                <h2 class="winner-name" id="winnerName">玩家 1</h2>
                <div class="victory-stats">
                    <div class="victory-stat">
                        <span>最终分数</span>
                        <span id="finalScore">0</span>
                    </div>
                    <div class="victory-stat">
                        <span>消除行数</span>
                        <span id="finalLines">0</span>
                    </div>
                    <div class="victory-stat">
                        <span>连胜记录</span>
                        <span id="finalStreak">0</span>
                    </div>
                </div>
                <div class="victory-buttons">
                    <button class="victory-btn" id="playAgainBtn">再来一局</button>
                    <button class="victory-btn secondary" id="backToMenuBtn">返回菜单</button>
                </div>
            </div>
        </div>

        <div class="pause-modal" id="pauseModal">
            <div class="pause-content">
                <h2>⏸️ 游戏暂停</h2>
                <p>按 P 键或点击继续按钮恢复游戏</p>
                <button class="victory-btn" id="resumeBtn">继续游戏</button>
                <button class="victory-btn secondary" id="pauseMenuBtn">返回菜单</button>
            </div>
        </div>
    </div>

    <canvas id="particleCanvas" class="particle-canvas"></canvas>

    <div class="test-panel" id="testPanel">
        <div class="test-panel-header">
            <h3>🧪 功能测试控制台</h3>
            <button class="test-toggle-btn" id="testToggleBtn">−</button>
        </div>
        <div class="test-panel-content" id="testPanelContent">
            <div class="test-summary" id="testSummary">
                <span class="test-passed">✓ 0 通过</span>
                <span class="test-failed">✗ 0 失败</span>
                <span class="test-total">总计 0</span>
            </div>
            <div class="test-buttons">
                <button class="test-btn" id="runAllTests">运行所有测试</button>
                <button class="test-btn secondary" id="runAudioTest">测试音效系统</button>
                <button class="test-btn secondary" id="runAITest">测试AI放置</button>
                <button class="test-btn secondary" id="runTouchTest">测试触摸控制</button>
                <button class="test-btn secondary" id="runPenaltyTest">测试惩罚行</button>
                <button class="test-btn secondary" id="runDifficultyTest">测试难度调节</button>
            </div>
            <div class="test-console" id="testConsole"></div>
        </div>
    </div>

    <script src="tests.js"></script>
    <script src="game.js"></script>
</body>
</html>
