<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}文件分享服务{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><a href="{{ url_for('index') }}">📁 文件分享</a></h1>
            <nav>
                <a href="{{ url_for('index') }}" class="nav-link">上传</a>
                <a href="{{ url_for('manage_files') }}" class="nav-link">管理</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>安全便捷的文件分享服务 | 自动过期 | 断点续传</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
