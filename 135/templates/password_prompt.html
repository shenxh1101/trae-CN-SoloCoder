{% extends "base.html" %}
{% block title %}输入访问密码{% endblock %}
{% block content %}
<div class="password-prompt">
    <div class="password-card">
        <div class="password-icon">🔒</div>
        <h2>此文件已加密</h2>
        <p>请输入访问密码以{% if is_preview %}预览{% else %}下载{% endif %}文件</p>
        <form id="passwordForm">
            <input type="password" id="passwordInput" placeholder="请输入密码" required>
            <p id="errorMsg" class="error-msg" style="display: none;"></p>
            <button type="submit" class="btn btn-primary btn-large">确认</button>
        </form>
    </div>
</div>
<script>
document.getElementById('passwordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const password = document.getElementById('passwordInput').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    try {
        const response = await fetch(`/api/verify-password/{{ short_code }}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        });
        const data = await response.json();
        if (data.success) {
            const separator = window.location.search.includes('?') ? '&' : '?';
            {% if is_preview %}
            window.location.href = `/p/{{ short_code }}${separator}password=${encodeURIComponent(password)}`;
            {% else %}
            window.location.href = `/s/{{ short_code }}${separator}password=${encodeURIComponent(password)}`;
            {% endif %}
        } else {
            errorMsg.textContent = data.error || '密码错误';
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.textContent = '验证失败，请重试';
        errorMsg.style.display = 'block';
    }
});
</script>
{% endblock %}
