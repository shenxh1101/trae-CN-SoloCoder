<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 文字云</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #0a1628;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: calc(100vh - 40px);
            background: rgba(20, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            z-index: 100;
        }

        .control-panel::-webkit-scrollbar {
            width: 6px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 3px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #8ab4f8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(238, 90, 111, 0.4);
        }

        .btn-block {
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-options {
            display: flex;
            gap: 10px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .color-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        .color-btn:hover {
            transform: scale(1.05);
        }

        .color-btn.dark-blue {
            background: #0a1628;
        }

        .color-btn.black {
            background: #000;
        }

        .color-btn.white {
            background: #fff;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 11px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .tag-list {
            max-height: 180px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
        }

        .tag-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .tag-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tag-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tag-name {
            font-weight: 500;
        }

        .tag-weight {
            font-size: 11px;
            color: #8ab4f8;
            padding: 2px 8px;
            background: rgba(138, 180, 248, 0.2);
            border-radius: 10px;
        }

        .delete-btn {
            padding: 4px 10px;
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(245, 87, 108, 0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #141e32;
            border-radius: 12px;
            padding: 24px;
            min-width: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .modal-content {
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .hidden-input {
            display: none;
        }

        .toggle-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-option label {
            font-size: 13px;
            color: #a0aec0;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 22px;
        }

        .hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            text-align: center;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.5);
            padding: 16px 24px;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 50, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 2000;
            animation: toastIn 0.3s ease-out;
            display: none;
        }

        .toast.show {
            display: block;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="loading" id="loading">加载中...</div>
    <div class="toast" id="toast"></div>

    <div class="control-panel">
        <h1 class="panel-title">✨ 3D 文字云</h1>

        <div class="section">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="tagCount">0</div>
                    <div class="stat-label">标签总数</div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">添加标签</div>
            <div class="form-group">
                <label>标签文字</label>
                <input type="text" id="tagText" placeholder="输入标签文字 (按Enter添加)">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>权重 (1-10)</label>
                    <input type="number" id="tagWeight" min="1" max="10" value="5">
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="addTag()">➕ 添加标签</button>
        </div>

        <div class="section">
            <div class="section-title">排列模式</div>
            <div class="form-group">
                <select id="layoutMode" onchange="changeLayoutMode()">
                    <option value="sphere">球体模式</option>
                    <option value="cube">立方体模式</option>
                    <option value="ring">环形模式</option>
                </select>
            </div>
            <div class="toggle-option">
                <label>标签朝向相机</label>
                <div class="toggle-switch active" id="faceCameraToggle" onclick="toggleFaceCamera()"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">背景颜色</div>
            <div class="color-options">
                <div class="color-btn dark-blue active" onclick="changeBackgroundColor('#0a1628', this)"></div>
                <div class="color-btn black" onclick="changeBackgroundColor('#000000', this)"></div>
                <div class="color-btn white" onclick="changeBackgroundColor('#ffffff', this)"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">标签列表</div>
            <div class="tag-list" id="tagList"></div>
            <div class="hint">💡 点击3D标签可快速删除</div>
        </div>

        <div class="section">
            <div class="section-title">操作</div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="exportConfig()">📤 导出</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入</button>
                <button class="btn btn-warning" onclick="takeScreenshot()">📷 截图</button>
            </div>
            <input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importConfig(event)">
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-title">确认删除</div>
            <div class="modal-content">确定要删除标签 "<span id="deleteTagName" style="color: #8ab4f8;"></span>" 吗？</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let tags = [];
        let tagMeshes = [];
        let layoutMode = 'sphere';
        let faceCamera = true;
        let backgroundColor = '#0a1628';
        let tagToDelete = null;
        let font = null;
        let raycaster, mouse;
        let isInitialized = false;
        let mouseDownPos = { x: 0, y: 0 };
        let isDragging = false;

        const defaultTags = [
            { text: 'JavaScript', weight: 10, color: '#f7df1e' },
            { text: 'Python', weight: 9, color: '#3776ab' },
            { text: 'React', weight: 8, color: '#61dafb' },
            { text: 'Vue', weight: 8, color: '#42b883' },
            { text: 'TypeScript', weight: 7, color: '#3178c6' },
            { text: 'Node.js', weight: 7, color: '#68a063' },
            { text: 'Three.js', weight: 6, color: '#049ef4' },
            { text: 'WebGL', weight: 5, color: '#990000' },
            { text: 'CSS', weight: 6, color: '#264de4' },
            { text: 'HTML', weight: 6, color: '#e34f26' },
            { text: 'Git', weight: 5, color: '#f05032' },
            { text: 'Docker', weight: 5, color: '#2496ed' },
            { text: 'AWS', weight: 4, color: '#ff9900' },
            { text: 'MongoDB', weight: 4, color: '#47a248' },
            { text: 'GraphQL', weight: 4, color: '#e10098' },
            { text: 'Rust', weight: 3, color: '#dea584' },
            { text: 'Go', weight: 3, color: '#00add8' },
            { text: 'Java', weight: 4, color: '#007396' },
            { text: 'Swift', weight: 3, color: '#fa7343' },
            { text: 'Kotlin', weight: 3, color: '#7f52ff' }
        ];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(backgroundColor);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 50;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x667eea, 0.5);
            pointLight2.position.set(-10, -10, -10);
            scene.add(pointLight2);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('mousedown', onCanvasMouseDown);
            renderer.domElement.addEventListener('mouseup', onCanvasMouseUp);
            renderer.domElement.addEventListener('mousemove', onCanvasMouseMove);

            document.getElementById('tagText').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    addTag();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeDeleteModal();
                }
            });

            window.addEventListener('resize', onWindowResize);
            
            animate();
            
            loadFontAndCreateTags();
        }

        function loadFontAndCreateTags() {
            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(loadedFont) {
                font = loadedFont;
                tags = [...defaultTags];
                createTags();
                updateTagList();
                updateStats();
                document.getElementById('loading').style.display = 'none';
                isInitialized = true;
                showToast('加载完成！点击3D标签可删除');
            });
        }

        function createTextTexture(text, weight, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const size = 512;
            canvas.width = size;
            canvas.height = size;

            const fontSize = 32 + weight * 8;
            context.font = `bold ${fontSize}px Arial`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            context.shadowColor = 'rgba(0, 0, 0, 0.5)';
            context.shadowBlur = 10;
            
            const gradient = context.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, color || '#ffffff');
            gradient.addColorStop(1, lightenColor(color || '#ffffff', 30));
            context.fillStyle = gradient;
            context.fillText(text, size / 2, size / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function createTagMesh(text, weight, color, position) {
            const texture = createTextTexture(text, weight, color);
            const scale = 0.02 + weight * 0.008;
            
            if (faceCamera) {
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.95
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(scale * 3, scale * 1.5, 1);
                return sprite;
            } else {
                const geometry = new THREE.PlaneGeometry(scale * 3, scale * 1.5);
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.95,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.lookAt(0, 0, 0);
                return mesh;
            }
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function lightenColor(color, percent) {
            const hex = color.replace('#', '');
            const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + percent);
            const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + percent);
            const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + percent);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function getPositionOnSphere(index, total, radius = 8) {
            const phi = Math.acos(-1 + (2 * index) / total);
            const theta = Math.sqrt(total * Math.PI) * phi;
            return new THREE.Vector3(
                radius * Math.cos(theta) * Math.sin(phi),
                radius * Math.sin(theta) * Math.sin(phi),
                radius * Math.cos(phi)
            );
        }

        function getPositionOnCube(index, total, size = 7) {
            const faces = 6;
            const perFace = Math.ceil(total / faces);
            const faceIndex = Math.floor(index / perFace);
            const localIndex = index % perFace;
            const perRow = Math.ceil(Math.sqrt(perFace));
            const u = (localIndex % perRow) / perRow - 0.5;
            const v = Math.floor(localIndex / perRow) / perRow - 0.5;

            const positions = [
                new THREE.Vector3(size, u * size * 2, v * size * 2),
                new THREE.Vector3(-size, u * size * 2, v * size * 2),
                new THREE.Vector3(u * size * 2, size, v * size * 2),
                new THREE.Vector3(u * size * 2, -size, v * size * 2),
                new THREE.Vector3(u * size * 2, v * size * 2, size),
                new THREE.Vector3(u * size * 2, v * size * 2, -size)
            ];

            return positions[faceIndex];
        }

        function getPositionOnRing(index, total, radius = 8, height = 3) {
            const angle = (index / total) * Math.PI * 2;
            const y = (Math.sin(index * 0.5) * height);
            const r = radius + (Math.sin(index * 0.8) * 1.5);
            return new THREE.Vector3(
                r * Math.cos(angle),
                y,
                r * Math.sin(angle)
            );
        }

        function createTags() {
            tagMeshes.forEach(mesh => {
                if (mesh.material.map) {
                    mesh.material.map.dispose();
                }
                mesh.material.dispose();
                if (mesh.geometry) {
                    mesh.geometry.dispose();
                }
                scene.remove(mesh);
            });
            tagMeshes = [];

            if (tags.length === 0) return;

            tags.forEach((tag, index) => {
                let position;
                switch (layoutMode) {
                    case 'sphere':
                        position = getPositionOnSphere(index, tags.length);
                        break;
                    case 'cube':
                        position = getPositionOnCube(index, tags.length);
                        break;
                    case 'ring':
                        position = getPositionOnRing(index, tags.length);
                        break;
                }

                const mesh = createTagMesh(tag.text, tag.weight, tag.color, position);
                mesh.position.copy(position);
                mesh.userData = { 
                    tag: tag, 
                    index: index,
                    originalPosition: position.clone(),
                    floatOffset: Math.random() * Math.PI * 2,
                    floatSpeed: 0.5 + Math.random() * 0.5,
                    baseColor: new THREE.Color(tag.color || '#ffffff')
                };

                scene.add(mesh);
                tagMeshes.push(mesh);
            });
        }

        function addTag() {
            const textInput = document.getElementById('tagText');
            const weightInput = document.getElementById('tagWeight');
            const text = textInput.value.trim();
            const weight = parseInt(weightInput.value) || 5;

            if (!text) {
                showToast('请输入标签文字');
                return;
            }

            const hue = (text.charCodeAt(0) * 17) % 360;
            const color = hslToHex(hue, 80, 65);

            tags.push({ text, weight, color });
            createTags();
            updateTagList();
            updateStats();

            textInput.value = '';
            weightInput.value = '5';
            textInput.focus();
            showToast(`已添加标签: ${text}`);
        }

        function removeTag(index) {
            if (index < 0 || index >= tags.length) return;
            tagToDelete = index;
            document.getElementById('deleteTagName').textContent = tags[index].text;
            document.getElementById('deleteModal').classList.add('show');
        }

        function confirmDelete() {
            if (tagToDelete !== null && tagToDelete >= 0 && tagToDelete < tags.length) {
                const tagName = tags[tagToDelete].text;
                tags.splice(tagToDelete, 1);
                createTags();
                updateTagList();
                updateStats();
                showToast(`已删除: ${tagName}`);
            }
            closeDeleteModal();
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            tagToDelete = null;
        }

        function onCanvasMouseDown(event) {
            mouseDownPos.x = event.clientX;
            mouseDownPos.y = event.clientY;
            isDragging = false;
        }

        function onCanvasMouseMove(event) {
            const dx = event.clientX - mouseDownPos.x;
            const dy = event.clientY - mouseDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                isDragging = true;
            }
        }

        function onCanvasMouseUp(event) {
            if (!isInitialized || isDragging) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(tagMeshes);

            if (intersects.length > 0) {
                const clickedTag = intersects[0].object;
                const tagIndex = clickedTag.userData.index;
                removeTag(tagIndex);
            }
        }

        function updateTagList() {
            const list = document.getElementById('tagList');
            list.innerHTML = tags.map((tag, index) => `
                <div class="tag-item">
                    <div class="tag-info">
                        <div class="tag-color" style="background: ${tag.color || '#667eea'}"></div>
                        <span class="tag-name">${tag.text}</span>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span class="tag-weight">权重: ${tag.weight}</span>
                        <button class="delete-btn" onclick="removeTag(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('tagCount').textContent = tags.length;
        }

        function changeLayoutMode() {
            layoutMode = document.getElementById('layoutMode').value;
            createTags();
            const modeNames = { 'sphere': '球体模式', 'cube': '立方体模式', 'ring': '环形模式' };
            showToast(`已切换到${modeNames[layoutMode]}`);
        }

        function toggleFaceCamera() {
            faceCamera = !faceCamera;
            document.getElementById('faceCameraToggle').classList.toggle('active', faceCamera);
            createTags();
            showToast(faceCamera ? '标签朝向相机' : '标签朝向球心');
        }

        function changeBackgroundColor(color, btn) {
            backgroundColor = color;
            scene.background = new THREE.Color(color);
            
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const isLight = color === '#ffffff';
            document.querySelectorAll('.tag-name').forEach(el => {
                el.style.color = isLight ? '#333' : '#fff';
            });

            const colorNames = { '#0a1628': '深蓝', '#000000': '黑色', '#ffffff': '白色' };
            showToast(`背景已切换为${colorNames[color]}`);
        }

        function exportConfig() {
            const tagsData = tags.map((tag, index) => {
                let position = null;
                if (tagMeshes[index]) {
                    const pos = tagMeshes[index].userData.originalPosition;
                    position = { x: pos.x, y: pos.y, z: pos.z };
                }
                return {
                    text: tag.text,
                    weight: tag.weight,
                    color: tag.color,
                    position: position
                };
            });

            const config = {
                version: '1.0',
                tags: tagsData,
                layoutMode: layoutMode,
                backgroundColor: backgroundColor,
                faceCamera: faceCamera,
                exportTime: new Date().toISOString()
            };

            const jsonString = JSON.stringify(config, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `3d-wordcloud-config-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('配置已导出');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    
                    if (config.tags && Array.isArray(config.tags)) {
                        tags = config.tags.map(tag => ({
                            text: tag.text || 'Tag',
                            weight: tag.weight || 5,
                            color: tag.color || null
                        }));
                    }
                    
                    if (config.layoutMode && ['sphere', 'cube', 'ring'].includes(config.layoutMode)) {
                        layoutMode = config.layoutMode;
                        document.getElementById('layoutMode').value = layoutMode;
                    }
                    
                    if (config.backgroundColor) {
                        backgroundColor = config.backgroundColor;
                        scene.background = new THREE.Color(backgroundColor);
                        
                        const isLight = backgroundColor === '#ffffff';
                        document.querySelectorAll('.tag-name').forEach(el => {
                            el.style.color = isLight ? '#333' : '#fff';
                        });
                        
                        document.querySelectorAll('.color-btn').forEach(b => {
                            if (b.getAttribute('onclick').includes(backgroundColor)) {
                                document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
                                b.classList.add('active');
                            }
                        });
                    }
                    
                    if (config.faceCamera !== undefined) {
                        faceCamera = config.faceCamera;
                        document.getElementById('faceCameraToggle').classList.toggle('active', faceCamera);
                    }
                    
                    createTags();
                    updateTagList();
                    updateStats();
                    showToast('配置已导入');
                } catch (err) {
                    alert('配置文件格式错误: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function takeScreenshot() {
            try {
                controls.update();
                renderer.render(scene, camera);
                
                const dataURL = renderer.domElement.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `3d-wordcloud-${Date.now()}.png`;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('截图已保存');
            } catch (err) {
                showToast('截图失败: ' + err.message);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            tagMeshes.forEach((mesh, index) => {
                const userData = mesh.userData;
                
                mesh.position.y = userData.originalPosition.y + 
                    Math.sin(time * userData.floatSpeed + userData.floatOffset) * 0.3;

                if (userData.baseColor) {
                    const hsl = { h: 0, s: 0, l: 0 };
                    userData.baseColor.getHSL(hsl);
                    const newHue = (hsl.h + time * 0.02) % 1;
                    mesh.material.color.setHSL(newHue, hsl.s, hsl.l);
                }

                if (!faceCamera && mesh.isMesh) {
                    mesh.lookAt(0, 0, 0);
                }
            });

            scene.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
