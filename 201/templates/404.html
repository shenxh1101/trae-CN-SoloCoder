<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 400px; width: 100%; text-align: center; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 8px; font-size: 24px; }
        p { color: #666; margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
        .code { display: inline-block; background: #f8f9fa; padding: 8px 16px; border-radius: 6px; font-family: monospace; font-size: 14px; margin-bottom: 20px; }
        a { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s; }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>页面不存在</h1>
        <div class="code">404 Not Found</div>
        <p>抱歉，您访问的短网址不存在。<br>请检查链接是否正确。</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
