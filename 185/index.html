<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Word Search - 拼字寻词</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="home-page" class="page">
      <div class="home-container">
        <h1 class="game-title">Word Search</h1>
        <p class="game-subtitle">拼字寻词</p>

        <section class="config-section">
          <h2 class="section-title">选择主题</h2>
          <div class="theme-cards">
            <div class="theme-card selected" data-theme="animals">
              <span class="theme-icon">🐾</span>
              <span class="theme-name">动物</span>
            </div>
            <div class="theme-card" data-theme="fruits">
              <span class="theme-icon">🍎</span>
              <span class="theme-name">水果</span>
            </div>
            <div class="theme-card" data-theme="countries">
              <span class="theme-icon">🌍</span>
              <span class="theme-name">国家</span>
            </div>
          </div>
        </section>

        <section class="config-section">
          <h2 class="section-title">选择难度</h2>
          <div class="diff-buttons">
            <button class="diff-btn selected" data-difficulty="easy">简单<br><small>3字母起</small></button>
            <button class="diff-btn" data-difficulty="medium">普通<br><small>4字母起</small></button>
            <button class="diff-btn" data-difficulty="hard">困难<br><small>5字母起</small></button>
          </div>
        </section>

        <section class="config-section">
          <h2 class="section-title">游戏模式</h2>
          <div class="mode-toggle-container">
            <span class="mode-icon">☕</span>
            <label class="mode-switch">
              <input type="checkbox" id="mode-toggle">
              <span class="mode-slider"></span>
            </label>
            <span class="mode-icon">⏱</span>
            <span id="mode-label" class="mode-label">休闲模式</span>
          </div>
        </section>

        <button id="start-btn" class="primary-btn">开始游戏</button>
        <button id="leaderboard-btn" class="secondary-btn">🏆 排行榜</button>
      </div>
    </div>

    <div id="game-page" class="page hidden">
      <header class="game-header">
        <button id="back-btn" class="icon-btn" title="返回">←</button>
        <div class="header-center">
          <div class="score-display">
            <span class="score-label">得分</span>
            <span id="score" class="score-value">0</span>
          </div>
          <div class="timer-display">
            <span id="timer" class="timer-value">00:00</span>
          </div>
        </div>
        <div class="header-right">
          <button id="hint-btn" class="icon-btn" title="提示">💡</button>
          <button id="sound-toggle" class="icon-btn" title="音效">🔊</button>
        </div>
      </header>

      <main class="game-main">
        <div class="grid-wrapper">
          <div id="grid-container" class="grid-container"></div>
        </div>
        <aside class="word-sidebar">
          <h3 class="sidebar-title">待发现单词</h3>
          <ul id="word-list" class="word-list"></ul>
          <button id="new-game-btn" class="secondary-btn small">🔄 新游戏</button>
        </aside>
      </main>
    </div>

    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="modal-title" class="modal-title">🎉 恭喜通关！</h2>
        <div class="modal-stats">
          <div class="stat-item">
            <span class="stat-label">用时</span>
            <span id="modal-time" class="stat-value">0分0秒</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">得分</span>
            <span id="modal-score" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">提示次数</span>
            <span id="modal-hints" class="stat-value">0</span>
          </div>
        </div>
        <div class="modal-actions">
          <button id="modal-restart" class="primary-btn">再来一局</button>
          <button id="modal-home" class="secondary-btn">返回主页</button>
        </div>
      </div>
    </div>

    <div id="leaderboard-modal" class="modal hidden">
      <div class="modal-content leaderboard-content">
        <h2 class="modal-title">🏆 排行榜</h2>
        <div class="lb-filters">
          <select id="lb-theme">
            <option value="animals">动物</option>
            <option value="fruits">水果</option>
            <option value="countries">国家</option>
          </select>
          <select id="lb-diff">
            <option value="easy">简单</option>
            <option value="medium">普通</option>
            <option value="hard">困难</option>
          </select>
          <select id="lb-mode">
            <option value="casual">休闲</option>
            <option value="timed">计时</option>
          </select>
        </div>
        <table class="lb-table">
          <thead>
            <tr><th>#</th><th>得分</th><th>用时</th><th>日期</th></tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
        <button id="lb-close" class="secondary-btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/wordbank.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
