
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        .captcha-section {
            margin-bottom: 25px;
        }
        .captcha-image-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .captcha-image {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .captcha-image:hover {
            border-color: #667eea;
        }
        .refresh-btn {
            background: #f5f5f5;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .refresh-btn:hover {
            background: #e0e0e0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .token-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        .token-info strong {
            color: #333;
        }
        .options {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .options-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .options-row:last-child {
            margin-bottom: 0;
        }
        .option-group {
            flex: 1;
        }
        .option-group label {
            font-size: 12px;
            margin-bottom: 4px;
        }
        .option-group input,
        .option-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 验证码测试</h1>
        
        <div class="options">
            <div class="options-row">
                <div class="option-group">
                    <label>模式</label>
                    <select id="mode">
                        <option value="text">字符模式</option>
                        <option value="math">算术模式</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>宽度</label>
                    <input type="number" id="width" value="200" min="100" max="400">
                </div>
                <div class="option-group">
                    <label>高度</label>
                    <input type="number" id="height" value="80" min="40" max="150">
                </div>
                <div class="option-group">
                    <label>字体</label>
                    <input type="number" id="fontSize" value="40" min="20" max="60">
                </div>
            </div>
        </div>
        
        <div class="captcha-section">
            <div class="captcha-image-wrapper">
                <img id="captchaImage" class="captcha-image" alt="验证码">
                <button class="refresh-btn" onclick="refreshCaptcha()">
                    🔄 刷新
                </button>
            </div>
            
            <div class="form-group">
                <label for="captchaInput">请输入验证码</label>
                <input type="text" id="captchaInput" placeholder="不区分大小写" autocomplete="off">
            </div>
            
            <button class="submit-btn" onclick="verifyCaptcha()">验证</button>
            
            <div id="message" class="message"></div>
            
            <div class="token-info">
                <strong>Token:</strong> <span id="tokenDisplay">未生成</span>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;

        async function loadCaptcha() {
            const width = document.getElementById('width').value;
            const height = document.getElementById('height').value;
            const fontSize = document.getElementById('fontSize').value;
            const mode = document.getElementById('mode').value;
            
            try {
                const response = await fetch(`/generate_captcha?width=${width}&height=${height}&font_size=${fontSize}&mode=${mode}&format=base64`);
                const data = await response.json();
                
                if (data.success) {
                    currentToken = data.token;
                    document.getElementById('captchaImage').src = data.image_base64;
                    document.getElementById('tokenDisplay').textContent = data.token;
                    document.getElementById('captchaInput').value = '';
                    document.getElementById('message').className = 'message';
                    document.getElementById('message').textContent = '';
                }
            } catch (error) {
                console.error('加载验证码失败:', error);
            }
        }

        async function refreshCaptcha() {
            if (!currentToken) {
                loadCaptcha();
                return;
            }
            
            const width = document.getElementById('width').value;
            const height = document.getElementById('height').value;
            const fontSize = document.getElementById('fontSize').value;
            const mode = document.getElementById('mode').value;
            
            try {
                const response = await fetch('/refresh_captcha', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: currentToken,
                        width: parseInt(width),
                        height: parseInt(height),
                        font_size: parseInt(fontSize),
                        mode: mode
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('captchaImage').src = data.image_base64;
                    document.getElementById('captchaInput').value = '';
                    document.getElementById('message').className = 'message';
                    document.getElementById('message').textContent = '';
                } else {
                    loadCaptcha();
                }
            } catch (error) {
                console.error('刷新验证码失败:', error);
                loadCaptcha();
            }
        }

        async function verifyCaptcha() {
            const input = document.getElementById('captchaInput').value;
            const messageEl = document.getElementById('message');
            
            if (!currentToken) {
                messageEl.className = 'message error';
                messageEl.textContent = '请先获取验证码';
                return;
            }
            
            if (!input.trim()) {
                messageEl.className = 'message error';
                messageEl.textContent = '请输入验证码';
                return;
            }
            
            try {
                const response = await fetch('/verify_captcha', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: currentToken,
                        captcha: input
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    messageEl.className = 'message success';
                    messageEl.textContent = data.message;
                    setTimeout(() => {
                        loadCaptcha();
                    }, 1500);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.message;
                    if (data.message.includes('锁定') || data.message.includes('过期')) {
                        setTimeout(() => {
                            loadCaptcha();
                        }, 1500);
                    } else {
                        document.getElementById('captchaInput').value = '';
                        document.getElementById('captchaInput').focus();
                    }
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '验证失败，请重试';
            }
        }

        document.getElementById('captchaInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyCaptcha();
            }
        });

        document.getElementById('captchaImage').addEventListener('click', refreshCaptcha);
        
        document.getElementById('mode').addEventListener('change', loadCaptcha);

        loadCaptcha();
    </script>
</body>
</html>
