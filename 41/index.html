<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="container">
        <header class="header">
            <h1 class="title">
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                安全密码生成器
            </h1>
            <p class="subtitle">快速生成安全、可靠的随机密码</p>
        </header>

        <main class="main-content">
            <section class="card password-display-card">
                <div class="password-wrapper">
                    <input type="text" id="password-output" class="password-output" readonly placeholder="点击生成按钮生成密码">
                    <button id="copy-btn" class="icon-btn" aria-label="复制密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="strength-container">
                    <div class="strength-label">
                        <span>密码强度</span>
                        <span id="strength-text" class="strength-text">--</span>
                    </div>
                    <div class="strength-bar">
                        <div id="strength-indicator" class="strength-indicator"></div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="generate-btn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        生成密码
                    </button>
                    <button id="generate-batch-btn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        批量生成 10 个
                    </button>
                    <button id="save-history-btn" class="btn btn-outline">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        添加到历史
                    </button>
                </div>
            </section>

            <section class="card settings-card">
                <h2 class="card-title">密码设置</h2>
                
                <div class="slider-container">
                    <div class="slider-header">
                        <label for="length-slider">密码长度</label>
                        <span id="length-value" class="length-value">16</span>
                    </div>
                    <input type="range" id="length-slider" class="slider" min="8" max="32" value="16">
                    <div class="slider-marks">
                        <span>8</span>
                        <span>16</span>
                        <span>24</span>
                        <span>32</span>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="include-uppercase" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">包含大写字母 (A-Z)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="include-lowercase" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">包含小写字母 (a-z)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="include-numbers" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">包含数字 (0-9)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="include-symbols" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">包含特殊符号 (!@#$%...)</span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="switch-group">
                    <label class="switch-label">
                        <input type="checkbox" id="exclude-ambiguous">
                        <span class="switch-custom"></span>
                        <span class="switch-text">
                            排除易混淆字符
                            <span class="hint">(0, O, 1, l, I)</span>
                        </span>
                    </label>
                    <label class="switch-label">
                        <input type="checkbox" id="pronounceable">
                        <span class="switch-custom"></span>
                        <span class="switch-text">
                            生成可发音密码
                            <span class="hint">便于记忆</span>
                        </span>
                    </label>
                </div>
            </section>

            <section class="card batch-results-card" id="batch-results-section" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">批量生成结果</h2>
                    <button id="clear-batch-btn" class="icon-btn small" aria-label="清空列表">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div id="batch-passwords-list" class="batch-passwords-grid"></div>
            </section>

            <section class="card history-card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        历史记录
                        <span id="history-count" class="count-badge">0</span>
                    </h2>
                    <button id="clear-history-btn" class="btn btn-danger btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        清空全部
                    </button>
                </div>
                <div id="history-list" class="history-list">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <p>暂无历史记录</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-message">操作成功</span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
