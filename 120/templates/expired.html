{% extends "base.html" %}

{% block title %}问卷已过期 - 问卷调查系统{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 30px;">
    <div style="font-size: 60px; margin-bottom: 20px;">⏰</div>
    <h2>问卷已过期</h2>
    <p style="color: #777; margin: 20px 0;">
        抱歉，"{{ survey.title }}" 已超过截止日期，无法继续提交。
    </p>
    <p style="color: #999; font-size: 14px; margin-bottom: 30px;">
        截止日期: {{ survey.expiry_date }}
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
