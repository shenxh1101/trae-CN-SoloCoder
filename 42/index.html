<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D立方体相册</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/orbit-controls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
    <div id="scene-container"></div>

    <div class="control-panel">
        <h2>控制面板</h2>
        
        <div class="control-group">
            <label>旋转速度: <span id="speed-value">0.01</span></label>
            <input type="range" id="speed-slider" min="0" max="0.05" step="0.001" value="0.01">
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="star-toggle" checked>
                星空背景
            </label>
        </div>

        <div class="control-group">
            <label>材质模式</label>
            <div class="btn-group">
                <button class="mode-btn active" data-mode="standard">标准</button>
                <button class="mode-btn" data-mode="wireframe">线框</button>
                <button class="mode-btn" data-mode="transparent">半透明</button>
            </div>
        </div>
    </div>

    <div class="action-panel">
        <button id="screenshot-btn" class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="3" y1="9" x2="9" y2="9"></line>
                <line x1="15" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="3" x2="9" y2="9"></line>
                <line x1="15" y1="3" x2="15" y2="9"></line>
                <line x1="9" y1="15" x2="9" y2="21"></line>
                <line x1="15" y1="15" x2="15" y2="21"></line>
                <line x1="3" y1="15" x2="9" y2="15"></line>
                <line x1="15" y1="15" x2="21" y2="15"></line>
            </svg>
            截图
        </button>
        <button id="reset-view-btn" class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
            重置视角
        </button>
        <button id="download-zip-btn" class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下载ZIP
        </button>
        <button id="upload-btn" class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            上传图片
        </button>
    </div>

    <div class="upload-panel" id="upload-panel">
        <div class="upload-panel-header">
            <h3>替换面图片</h3>
            <button class="close-btn" id="close-upload">&times;</button>
        </div>
        <div class="face-selector">
            <button class="face-btn" data-face="0">前面</button>
            <button class="face-btn" data-face="1">后面</button>
            <button class="face-btn" data-face="2">左面</button>
            <button class="face-btn" data-face="3">右面</button>
            <button class="face-btn" data-face="4">上面</button>
            <button class="face-btn" data-face="5">下面</button>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        <button class="select-file-btn" id="select-file-btn">选择图片</button>
        <div class="preview-area" id="preview-area"></div>
    </div>

    <div class="modal" id="image-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <button class="modal-nav modal-prev" id="modal-prev">&#10094;</button>
            <img id="modal-image" src="" alt="大图预览">
            <button class="modal-nav modal-next" id="modal-next">&#10095;</button>
            <div class="modal-caption">
                <span id="modal-caption">前面</span>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <p>🖱️ 拖拽旋转 | 滚轮缩放 | 点击图片查看大图</p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
