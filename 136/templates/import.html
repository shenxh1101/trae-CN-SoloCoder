{% extends "base.html" %}

{% block title %}导入文档 - Markdown文档管理系统{% endblock %}

{% block content %}
<div class="import-page">
    <div class="page-header">
        <h1>📥 导入文档</h1>
    </div>

    <div class="import-form-container">
        <form method="post" enctype="multipart/form-data" class="import-form">
            <div class="form-group">
                <label>选择文件</label>
                <div class="file-upload-area">
                    <input type="file" name="file" id="file-input" accept=".md,.zip" required>
                    <label for="file-input" class="file-upload-label">
                        <span class="upload-icon">📁</span>
                        <span>点击选择文件，或拖拽到此处</span>
                        <span class="file-hint">支持 .md 文件或 .zip 压缩包</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="target_folder">目标文件夹 (可选)</label>
                <select name="target_folder" id="target_folder">
                    <option value="">根目录</option>
                    {% macro folder_options(items, prefix='') %}
                        {% for item in items %}
                            {% if item.type == 'folder' %}
                                <option value="{{ item.path }}">{{ prefix }}{{ item.name }}</option>
                                {% if item.children %}
                                    {{ folder_options(item.children, prefix + '　') }}
                                {% endif %}
                            {% endif %}
                        {% endfor %}
                    {% endmacro %}
                    {{ folder_options(tree) }}
                </select>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn">取消</a>
                <button type="submit" class="btn btn-primary">📥 开始导入</button>
            </div>
        </form>

        <div class="import-help">
            <h3>📖 导入说明</h3>
            <ul>
                <li><strong>单个 .md 文件:</strong> 直接上传Markdown文件</li>
                <li><strong>ZIP 压缩包:</strong> 压缩包内的所有 .md 文件将被导入，保持原有目录结构</li>
                <li>如果文件名已存在，将自动添加时间戳后缀</li>
                <li>ZIP包中以下划线开头的文件和文件夹将被忽略</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const fileInput = document.getElementById('file-input');
const uploadLabel = document.querySelector('.file-upload-label');

fileInput.addEventListener('change', function(e) {
    if (this.files.length > 0) {
        uploadLabel.innerHTML = `
            <span class="upload-icon">✅</span>
            <span>已选择: ${this.files[0].name}</span>
            <span class="file-hint">${(this.files[0].size / 1024 / 1024).toFixed(2)} MB</span>
        `;
    }
});

const dropArea = document.querySelector('.file-upload-area');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
}

['dragenter', 'dragover'].forEach(eventName => {
    dropArea.addEventListener(eventName, highlight, false);
});

['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, unhighlight, false);
});

function highlight() {
    dropArea.classList.add('drag-over');
}

function unhighlight() {
    dropArea.classList.remove('drag-over');
}

dropArea.addEventListener('drop', handleDrop, false);

function handleDrop(e) {
    const dt = e.dataTransfer;
    const files = dt.files;
    fileInput.files = files;
    if (files.length > 0) {
        uploadLabel.innerHTML = `
            <span class="upload-icon">✅</span>
            <span>已选择: ${files[0].name}</span>
            <span class="file-hint">${(files[0].size / 1024 / 1024).toFixed(2)} MB</span>
        `;
    }
}
</script>
{% endblock %}
