<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 分享文档</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <style>
        .share-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .share-header { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .share-notice { background: #e8f5e9; padding: 10px 15px; border-radius: 5px; color: #2e7d32; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="share-container">
        <div class="share-header">
            <h1>{{ title }}</h1>
            <div class="share-notice">
                🔍 这是一份只读分享文档，您可以查看但不能编辑。
            </div>
        </div>

        <div class="content-area">
            <article class="markdown-body">
                {{ html_content | safe }}
            </article>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'default' });
        if (typeof hljs !== 'undefined') {
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }
    </script>
</body>
</html>
