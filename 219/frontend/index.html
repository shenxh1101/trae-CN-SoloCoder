<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 图像着色工作台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🎨 AI 图像着色</h1>
                <div class="server-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">连接中...</span>
                    <span class="divider">|</span>
                    <span id="queueInfo">队列: <strong id="queueLength">0</strong></span>
                    <span class="divider">|</span>
                    <span id="inferenceInfo">推理: <strong id="inferenceTime">--</strong>s</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-ghost" id="btnHistory" title="着色历史">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    历史
                </button>
                <button class="btn btn-ghost" id="btnBatch" title="批量着色">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
                    批量
                </button>
            </div>
        </header>

        <main class="app-main">
            <section class="workspace" id="workspace">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-content">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        <p class="upload-title">拖拽或点击上传黑白图片</p>
                        <p class="upload-hint">支持 PNG / JPG / BMP / WebP</p>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>

                <div class="comparison-container" id="comparisonContainer" style="display:none;">
                    <div class="comparison-toolbar">
                        <div class="toolbar-left">
                            <button class="btn btn-sm active" data-view="slider" id="btnSliderView">滑动对比</button>
                            <button class="btn btn-sm" data-view="side" id="btnSideView">并排对比</button>
                        </div>
                        <div class="toolbar-center">
                            <span class="label-tag">原图</span>
                            <span class="label-tag accent">着色</span>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-sm btn-icon" id="btnReupload" title="重新上传">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="comparison-area" id="comparisonArea">
                        <div class="slider-view" id="sliderView">
                            <canvas id="sliderCanvas"></canvas>
                            <div class="slider-handle" id="sliderHandle">
                                <div class="slider-line"></div>
                                <div class="slider-grip">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                                </div>
                            </div>
                        </div>

                        <div class="side-view" id="sideView" style="display:none;">
                            <div class="side-panel">
                                <span class="side-label">原图</span>
                                <canvas id="originalCanvas"></canvas>
                            </div>
                            <div class="side-panel">
                                <span class="side-label">着色结果</span>
                                <canvas id="colorizedCanvas"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="brush-overlay" id="brushOverlay" style="display:none;">
                        <canvas id="brushCanvas"></canvas>
                    </div>
                </div>
            </section>

            <aside class="control-panel" id="controlPanel">
                <div class="panel-section">
                    <h3 class="section-title">着色参数</h3>
                    <div class="param-group">
                        <label class="param-label">
                            <span>色调倾向</span>
                            <span class="param-value" id="warmthValue">0</span>
                        </label>
                        <div class="slider-track">
                            <span class="slider-label-left">冷色</span>
                            <input type="range" id="warmthSlider" min="-100" max="100" value="0" step="1">
                            <span class="slider-label-right">暖色</span>
                        </div>
                    </div>
                    <div class="param-group">
                        <label class="param-label">
                            <span>饱和度</span>
                            <span class="param-value" id="saturationValue">100%</span>
                        </label>
                        <input type="range" id="saturationSlider" min="0" max="200" value="100" step="1">
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="section-title">局部着色</h3>
                    <div class="brush-controls">
                        <button class="btn btn-sm" id="btnBrushToggle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                            画笔模式
                        </button>
                        <div class="brush-size-group" id="brushSizeGroup" style="display:none;">
                            <label>大小</label>
                            <input type="range" id="brushSizeSlider" min="5" max="80" value="20" step="1">
                            <span class="param-value" id="brushSizeValue">20</span>
                        </div>
                        <div class="brush-actions" id="brushActions" style="display:none;">
                            <button class="btn btn-sm btn-primary" id="btnRecolorRegion">重新着色区域</button>
                            <button class="btn btn-sm btn-ghost" id="btnClearMask">清除标记</button>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="section-title">操作</h3>
                    <div class="action-buttons">
                        <button class="btn btn-primary btn-block" id="btnColorize" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            开始着色
                        </button>
                        <button class="btn btn-secondary btn-block" id="btnAdjust" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                            应用调整
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="section-title">导出</h3>
                    <div class="export-group">
                        <select id="exportFormat">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                        </select>
                        <label class="checkbox-label" id="transparencyOption">
                            <input type="checkbox" id="keepTransparency"> 保留透明度
                        </label>
                        <button class="btn btn-secondary btn-block" id="btnExport" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            导出图片
                        </button>
                    </div>
                </div>
            </aside>
        </main>

        <div class="modal-overlay" id="historyModal" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2>着色历史</h2>
                    <button class="btn btn-icon" id="btnCloseHistory">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="history-toolbar">
                        <button class="btn btn-sm btn-ghost" id="btnImportHistory">导入历史</button>
                        <button class="btn btn-sm btn-ghost" id="btnExportHistory">导出历史</button>
                        <button class="btn btn-sm btn-danger" id="btnClearHistory">清空历史</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <p class="empty-hint">暂无着色历史</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="batchModal" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2>批量着色</h2>
                    <button class="btn btn-icon" id="btnCloseBatch">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="batch-upload-zone" id="batchUploadZone">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
                        <p>上传包含黑白图片的 ZIP 文件</p>
                        <input type="file" id="batchFileInput" accept=".zip" hidden>
                    </div>
                    <div class="batch-progress" id="batchProgress" style="display:none;">
                        <div class="progress-bar"><div class="progress-fill" id="batchProgressFill"></div></div>
                        <p id="batchStatus">处理中...</p>
                    </div>
                    <button class="btn btn-primary btn-block" id="btnStartBatch" disabled>开始批量着色</button>
                </div>
            </div>
        </div>

        <div class="loading-overlay" id="loadingOverlay" style="display:none;">
            <div class="loading-spinner"></div>
            <p id="loadingText">正在着色...</p>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/comparison.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/history.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
