{% extends "base.html" %}

{% block title %}片段已过期 - CodeShare{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-icon expired">
            <i class="fas fa-hourglass-end"></i>
        </div>
        <h1>代码片段已过期</h1>
        <p>此代码片段已超过设定的有效期，已被自动删除。</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> 返回首页
        </a>
    </div>
</div>
{% endblock %}
