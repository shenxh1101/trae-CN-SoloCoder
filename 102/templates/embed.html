<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title }} - CodeShare</title>
    <style>
        {{ pygments_css|safe }}
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #272822;
            color: #fff;
        }
        .embed-header {
            background: #1e1f1c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3e3d32;
        }
        .embed-title {
            font-size: 14px;
            font-weight: 500;
            color: #f8f8f2;
        }
        .embed-meta {
            font-size: 12px;
            color: #75715e;
        }
        .code-highlight {
            margin: 0;
            padding: 10px 0;
        }
        .code-highlight table {
            width: 100%;
            border-collapse: collapse;
        }
        .code-highlight .linenos {
            text-align: right;
            padding: 0 10px;
            color: #75715e;
            background: #1e1f1c;
            user-select: none;
            width: 50px;
        }
        .code-highlight .code {
            padding: 0 15px;
            overflow-x: auto;
        }
        .code-highlight pre {
            margin: 0;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="embed-header">
        <span class="embed-title">{{ meta.title }}</span>
        <span class="embed-meta">{{ meta.language|title }} · {{ meta.author }}</span>
    </div>
    {{ highlighted|safe }}
</body>
</html>
