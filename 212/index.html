<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 艺术风格迁移 - Art Style Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI 艺术风格迁移</h1>
      <p>将您的照片转化为艺术大师的杰作</p>
    </header>

    <div class="main-grid">
      <aside class="sidebar">
        <div class="card">
          <h2>上传图片</h2>
          <div class="upload-area" id="uploadArea">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p>点击或拖拽上传图片</p>
            <p><span class="browse-text">支持批量上传</span></p>
          </div>
          <input type="file" class="upload-input" id="uploadInput" accept="image/*" multiple>
        </div>

        <div class="card">
          <h2>选择艺术风格</h2>
          <div class="style-grid" id="styleGrid"></div>
        </div>

        <div class="card">
          <h2>调整参数</h2>
          <div class="control-group">
            <label>
              <span>风格强度</span>
              <span class="value" id="intensityValue">70%</span>
            </label>
            <input type="range" class="slider" id="intensitySlider" min="0" max="100" value="70">
          </div>

          <div class="toggle-group">
            <span>对比模式</span>
            <div class="toggle" id="compareToggle"></div>
          </div>
        </div>

        <div class="card" id="batchContainer" style="display: none;">
          <h2>批量处理</h2>
          <div class="batch-list" id="batchList"></div>
          <button class="btn btn-primary btn-full" id="btnBatchDownload">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            批量下载 ZIP
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div class="card">
          <div class="canvas-container" id="canvasContainer">
            <div class="canvas-wrapper" id="canvasWrapper">
              <div class="canvas-original">
                <canvas id="canvasOriginal"></canvas>
              </div>
              <div class="canvas-styled">
                <canvas id="canvasStyled"></canvas>
              </div>
              <div class="chunk-indicator" id="chunkIndicator" style="display: none;"></div>
              <div class="compare-slider" id="compareSlider" style="display: none;"></div>
              <div class="placeholder" id="placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>上传图片开始创作</p>
              </div>
            </div>
            
            <div class="processing-overlay" id="processingOverlay">
              <div class="spinner"></div>
              <p>处理中...</p>
            </div>
          </div>

          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-info">
              <span>进度: <span id="progressPercent">0%</span></span>
              <span>耗时: <span class="time" id="processingTime">0ms</span></span>
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-accent" id="btnDownload">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              下载 PNG
            </button>
            <button class="btn btn-primary" id="btnRandom">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <polyline points="16 3 21 3 21 8"/>
                <line x1="4" y1="20" x2="21" y2="3"/>
                <polyline points="21 16 21 21 16 21"/>
                <line x1="15" y1="15" x2="21" y2="21"/>
                <line x1="4" y1="4" x2="9" y2="9"/>
              </svg>
              随机混合
            </button>
            <button class="btn btn-secondary" id="btnReset">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              重置
            </button>
          </div>
        </div>
      </main>
    </div>

    <footer>
      <p>🎨 AI 艺术风格迁移 - 基于 Canvas 的纯前端实现</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
