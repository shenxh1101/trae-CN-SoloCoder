<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册兴趣偏好 - AI个性化新闻推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .checkbox-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .checkbox-item input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-item input:checked + label {
            color: #667eea;
            font-weight: 500;
        }
        .checkbox-item:has(input:checked) {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .checkbox-item label {
            cursor: pointer;
            color: #333;
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .import-link {
            text-align: center;
            margin-top: 20px;
        }
        .import-link a {
            color: #667eea;
            text-decoration: none;
        }
        .import-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 AI个性化新闻推荐</h1>
        <p class="subtitle">选择您感兴趣的新闻类别和关键词，开启专属资讯之旅</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="section">
                <div class="section-title">📂 选择感兴趣的新闻类别</div>
                <div class="checkbox-grid">
                    {% for category in categories %}
                    <div class="checkbox-item">
                        <input type="checkbox" id="cat_{{ category }}" name="categories" value="{{ category }}">
                        <label for="cat_{{ category }}">{{ category }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">🏷️ 选择感兴趣的关键词</div>
                <div class="checkbox-grid">
                    {% for keyword in keywords[:50] %}
                    <div class="checkbox-item">
                        <input type="checkbox" id="kw_{{ keyword }}" name="keywords" value="{{ keyword }}">
                        <label for="kw_{{ keyword }}">{{ keyword }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <button type="submit" class="btn">开始我的个性化推荐 →</button>
        </form>
        
        <div class="import-link">
            <a href="{{ url_for('import_preferences') }}">已有偏好配置文件？点击导入</a>
        </div>
    </div>
</body>
</html>
