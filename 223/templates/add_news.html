{% extends 'base.html' %}

{% block title %}添加新闻 - AI新闻推荐{% endblock %}

{% block content %}
    <h2 style="color: #333; margin-bottom: 25px;">➕ 添加新闻</h2>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; font-weight: 500; color: #333;">新闻JSON数据</label>
            <p style="color: #666; margin-bottom: 10px; font-size: 14px;">
                支持单条新闻对象或新闻数组。格式示例：
            </p>
            <pre style="background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 15px; font-size: 12px;">{
  "title": "新闻标题",
  "summary": "新闻摘要内容",
  "category": "科技",
  "keywords": ["关键词1", "关键词2"]
}</pre>
            <textarea 
                name="news_json" 
                rows="10" 
                style="width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; font-family: monospace; font-size: 14px; resize: vertical;"
                placeholder='[{"title": "新闻标题", "summary": "新闻摘要", "category": "科技", "keywords": ["关键词"]}]'
                required
            ></textarea>
        </div>
        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn">提交添加</button>
            <a href="{{ url_for('admin') }}" class="btn" style="background: #999;">取消</a>
        </div>
    </form>
{% endblock %}
