<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链接服务 - ShortLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="url"], input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .result-value {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .copy-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .copy-btn:hover {
            background: #5568d3;
        }
        .error {
            color: #e74c3c;
            background: #fdf0ed;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .nav-links {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .admin-key {
            background: #fff3cd;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
        }
        .admin-key strong {
            color: #856404;
        }
        .optional {
            color: #999;
            font-weight: normal;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 短链接服务</h1>
        <p class="subtitle">快速生成简洁美观的短链接</p>
        
        <div class="error" id="error"></div>
        
        <form id="createForm">
            <div class="form-group">
                <label for="long_url">长网址</label>
                <input type="url" id="long_url" name="long_url" placeholder="https://example.com/very/long/url" required>
            </div>
            
            <div class="form-group">
                <label for="custom_code">自定义短码 <span class="optional">(可选)</span></label>
                <input type="text" id="custom_code" name="custom_code" placeholder="留空自动生成，3-20字符" maxlength="20">
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="password">访问密码 <span class="optional">(可选)</span></label>
                    <input type="password" id="password" name="password" placeholder="设置后访问需输入密码">
                </div>
                <div class="form-group">
                    <label for="expiry_type">有效期</label>
                    <select id="expiry_type" name="expiry_type">
                        <option value="permanent">永久有效</option>
                        <option value="hours">按小时</option>
                        <option value="days">按天</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group" id="expiryValueGroup" style="display: none;">
                <label for="expiry_value">有效时长</label>
                <input type="number" id="expiry_value" name="expiry_value" value="24" min="1">
            </div>
            
            <button type="submit">生成短链接</button>
        </form>
        
        <div class="result" id="result">
            <div class="result-label">短链接</div>
            <div class="result-value" id="shortUrl"></div>
            <button class="copy-btn" onclick="copyToClipboard('shortUrl')">复制短链接</button>
            <a id="statsLink" style="display: inline-block; padding: 8px 16px; background: #28a745; color: white; border-radius: 6px; text-decoration: none; font-size: 14px; margin-right: 10px;" href="#">查看统计</a>
            <a id="qrLink" style="display: inline-block; padding: 8px 16px; background: #17a2b8; color: white; border-radius: 6px; text-decoration: none; font-size: 14px;" href="#" download>下载二维码</a>
            
            <div class="admin-key">
                <strong>🔑 管理密钥：</strong><span id="adminKey"></span>
                <div style="font-size: 12px; color: #666; margin-top: 5px;">请妥善保存此密钥，用于管理短链接</div>
            </div>
        </div>
        
        <div class="nav-links">
            <a href="/batch">批量创建</a>
            <a href="/stats">统计查询</a>
        </div>
    </div>

    <script>
        document.getElementById('expiry_type').addEventListener('change', function() {
            document.getElementById('expiryValueGroup').style.display = 
                this.value === 'permanent' ? 'none' : 'block';
        });

        document.getElementById('createForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');

            const formData = new FormData(this);
            const longUrl = document.getElementById('long_url').value;
            
            if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
                errorDiv.textContent = '请输入以 http:// 或 https:// 开头的网址';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/create', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('shortUrl').textContent = data.short_url;
                    document.getElementById('adminKey').textContent = data.admin_key;
                    document.getElementById('statsLink').href = '/stats/' + data.short_code;
                    document.getElementById('qrLink').href = '/qrcode/' + data.short_code;
                    resultDiv.classList.add('show');
                } else {
                    errorDiv.textContent = data.error || '创建失败';
                    errorDiv.classList.add('show');
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请重试';
                errorDiv.classList.add('show');
            }
        });

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '已复制！';
                setTimeout(() => btn.textContent = originalText, 1500);
            });
        }
    </script>
</body>
</html>
