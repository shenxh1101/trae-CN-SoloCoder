<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 几何体博物馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="scene-container"></div>
    
    <div class="title-bar">
        <h1 class="title">3D 几何体博物馆</h1>
        <p class="subtitle">3D Geometry Museum</p>
    </div>

    <div class="fps-counter">
        <span class="fps-label">FPS</span>
        <span class="fps-value" id="fps-value">60</span>
    </div>

    <div class="control-panel">
        <div class="panel-header">
            <h2>控制面板</h2>
        </div>
        
        <div class="control-section">
            <label class="section-label">材质类型</label>
            <div class="btn-group" id="material-buttons">
                <button class="control-btn active" data-material="metal">金属</button>
                <button class="control-btn" data-material="plastic">塑料</button>
                <button class="control-btn" data-material="wireframe">线框</button>
            </div>
        </div>

        <div class="control-section">
            <label class="section-label">背景风格</label>
            <div class="btn-group" id="background-buttons">
                <button class="control-btn" data-bg="black">纯黑</button>
                <button class="control-btn" data-bg="darkblue">深蓝</button>
                <button class="control-btn active" data-bg="exhibition">展厅</button>
            </div>
        </div>

        <div class="control-section">
            <label class="section-label">
                展示台色调
                <span class="value-display" id="hue-value">210°</span>
            </label>
            <input type="range" class="slider" id="hue-slider" min="0" max="360" value="210">
        </div>

        <div class="control-section">
            <label class="section-label">
                旋转速度
                <span class="value-display" id="speed-value">1.0x</span>
            </label>
            <input type="range" class="slider" id="speed-slider" min="0" max="3" step="0.1" value="1">
        </div>

        <div class="control-section">
            <label class="section-label">工具</label>
            <div class="btn-group">
                <button class="control-btn icon-btn" id="screenshot-btn" title="截图">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    截图
                </button>
                <button class="control-btn icon-btn" id="autotour-btn" title="自动导览">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    导览
                </button>
                <button class="control-btn icon-btn" id="reset-btn" title="重置视角">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    重置
                </button>
            </div>
        </div>
    </div>

    <div class="info-panel" id="info-panel">
        <button class="close-btn" id="close-info">×</button>
        <div class="info-header">
            <h3 id="geo-name">几何体名称</h3>
            <span id="geo-name-en">Geometry Name</span>
        </div>
        <div class="info-content">
            <div class="info-item">
                <span class="info-label">面数</span>
                <span class="info-value" id="geo-faces">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">顶点数</span>
                <span class="info-value" id="geo-vertices">-</span>
            </div>
            <div class="info-item formula">
                <span class="info-label">体积公式</span>
                <span class="info-value formula-text" id="geo-formula">-</span>
            </div>
        </div>
        <div class="info-hint">点击空白处或关闭按钮退出</div>
    </div>

    <div class="autotour-indicator" id="autotour-indicator">
        <div class="tour-progress">
            <div class="tour-progress-bar" id="tour-progress-bar"></div>
        </div>
        <span>自动导览中</span>
        <button class="stop-tour" id="stop-tour">停止</button>
    </div>

    <div class="hint-bar">
        <span>🖱️ 拖拽旋转 | 滚轮缩放 | 点击几何体查看详情</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/geometries.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
