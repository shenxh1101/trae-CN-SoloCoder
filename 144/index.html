<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猴子接香蕉 🍌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🐵 猴子接香蕉 🍌</h1>
        
        <div class="status-bar">
            <div class="status-card score-card">
                <span class="label">得分</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="status-card highscore-card">
                <span class="label">最高分</span>
                <span class="value" id="highScore">0</span>
            </div>
            <div class="status-card time-card">
                <span class="label">时间</span>
                <span class="value" id="timeLeft">60</span>
            </div>
            <div class="status-card combo-card">
                <span class="label">连击</span>
                <span class="value" id="combo">0</span>
            </div>
            <div class="status-card speed-card" style="grid-column: span 4; margin-top: 8px; font-size: 0.8rem;">
                <span>速度倍率: <strong id="speedMultiplier">1.0x</strong></span>
            </div>
        </div>

        <div class="canvas-wrapper jungle">
            <canvas id="gameCanvas"></canvas>
            <div class="milestone-flash" id="milestoneFlash"></div>
            <div class="game-over-modal" id="gameOverModal">
                <div class="modal-content">
                    <h2>🎉 游戏结束！</h2>
                    <p class="final-score">最终得分: <span id="finalScore">0</span></p>
                    <p class="high-score-text" id="newHighScore" style="display: none;">🏆 新纪录！</p>
                    <button class="btn btn-primary" onclick="resetGame()">再来一局</button>
                </div>
            </div>
            <div class="pause-overlay" id="pauseOverlay">
                <div class="pause-content">
                    <h2>⏸️ 游戏暂停</h2>
                    <p>点击继续按钮恢复游戏</p>
                </div>
            </div>
            <div class="powerup-indicator" id="powerupIndicator"></div>
        </div>

        <div class="control-panel">
            <button class="btn btn-start" id="startBtn" onclick="startGame()">
                ▶️ 开始
            </button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pauseGame()" disabled>
                ⏸️ 暂停
            </button>
            <button class="btn btn-reset" onclick="resetGame()">
                🔄 重置
            </button>
            <button class="btn btn-sound" id="soundBtn" onclick="toggleSound()">
                🔊 音效
            </button>
            <button class="btn btn-bg" onclick="toggleBackground()">
                🖼️ 背景
            </button>
        </div>

        <div class="instructions">
            <p>⌨️ 键盘: ← → 方向键移动 | 📱 触屏: 左右滑动</p>
            <p class="powerup-info">
                ⭐ 双倍得分 | 🐢 减慢速度 | 📏 扩大范围 | 💣 炸弹扣分
            </p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
