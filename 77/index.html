<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 螺旋环效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #controls::-webkit-scrollbar {
            width: 6px;
        }

        #controls::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        #controls::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 3px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #64b5f6;
            text-align: center;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #90caf9;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #64b5f6, #42a5f5);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.5);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .value-display {
            min-width: 50px;
            text-align: right;
            font-size: 12px;
            color: #fff;
            font-family: monospace;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            background: linear-gradient(135deg, #1976d2, #1565c0);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        button:hover {
            background: linear-gradient(135deg, #1e88e5, #1976d2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider-toggle {
            background: linear-gradient(135deg, #64b5f6, #42a5f5);
        }

        input:checked + .slider-toggle:before {
            transform: translateX(24px);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .toggle-label {
            font-size: 13px;
            color: #e3f2fd;
        }

        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 4px;
        }

        .stat-label {
            color: #90caf9;
        }

        .stat-value {
            color: #fff;
        }

        #file-input {
            display: none;
        }

        .section-title {
            font-size: 14px;
            color: #64b5f6;
            margin: 15px 0 10px 0;
            padding-top: 10px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
        }

        .bg-buttons {
            display: flex;
            gap: 8px;
        }

        .bg-btn {
            flex: 1;
            padding: 8px;
            font-size: 11px;
            min-width: auto;
        }

        .bg-btn.active {
            box-shadow: 0 0 0 2px #64b5f6 inset;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h2>🎛️ 螺旋环控制面板</h2>

        <div class="section-title">螺旋参数</div>

        <div class="control-group">
            <label>螺旋半径</label>
            <div class="slider-container">
                <input type="range" id="radius" min="2" max="15" step="0.1" value="8">
                <span class="value-display" id="radius-value">8.0</span>
            </div>
        </div>

        <div class="control-group">
            <label>螺旋圈数</label>
            <div class="slider-container">
                <input type="range" id="turns" min="1" max="5" step="0.1" value="3">
                <span class="value-display" id="turns-value">3.0</span>
            </div>
        </div>

        <div class="control-group">
            <label>立方体数量</label>
            <div class="slider-container">
                <input type="range" id="count" min="100" max="1000" step="10" value="500">
                <span class="value-display" id="count-value">500</span>
            </div>
        </div>

        <div class="control-group">
            <label>立方体大小</label>
            <div class="slider-container">
                <input type="range" id="size" min="0.1" max="2" step="0.1" value="0.5">
                <span class="value-display" id="size-value">0.5</span>
            </div>
        </div>

        <div class="section-title">显示模式</div>

        <div class="toggle-container">
            <span class="toggle-label">粒子模式</span>
            <label class="toggle-switch">
                <input type="checkbox" id="particleMode">
                <span class="slider-toggle"></span>
            </label>
        </div>

        <div class="toggle-container">
            <span class="toggle-label">自动旋转</span>
            <label class="toggle-switch">
                <input type="checkbox" id="autoRotate" checked>
                <span class="slider-toggle"></span>
            </label>
        </div>

        <div class="toggle-container">
            <span class="toggle-label">运动模糊</span>
            <label class="toggle-switch">
                <input type="checkbox" id="motionBlur">
                <span class="slider-toggle"></span>
            </label>
        </div>

        <div class="section-title">背景</div>
        <div class="bg-buttons">
            <button class="bg-btn active" data-bg="black">黑色</button>
            <button class="bg-btn" data-bg="darkblue">深蓝</button>
            <button class="bg-btn" data-bg="starry">星空</button>
        </div>

        <div class="section-title">操作</div>
        <div class="button-group">
            <button id="screenshotBtn">📸 截图</button>
            <button id="exportBtn">💾 导出配置</button>
            <button id="importBtn">📂 导入配置</button>
        </div>

        <input type="file" id="file-input" accept=".json">
    </div>

    <div id="stats">
        <div class="stat-item">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="fps">60</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">物体数量:</span>
            <span class="stat-value" id="objectCount">500</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, controls, composer;
        let spiralGroup, trailGroup;
        let cubes = [];
        let particleSystem;
        let isParticleMode = false;
        let autoRotate = true;
        let motionBlurEnabled = false;
        let currentBackground = 'black';
        let trailMeshes = [];
        let maxTrailLength = 8;
        let particleSprite;

        const config = {
            radius: 8,
            turns: 3,
            count: 500,
            cubeSize: 0.5
        };

        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;

        function createParticleSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 100;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x4fc3f7, 1, 100);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xf48fb1, 1, 100);
            pointLight2.position.set(-10, -10, -10);
            scene.add(pointLight2);

            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.6,
                0.4,
                0.85
            );

            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            particleSprite = createParticleSprite();

            spiralGroup = new THREE.Group();
            scene.add(spiralGroup);

            trailGroup = new THREE.Group();
            scene.add(trailGroup);

            createSpiral();

            window.addEventListener('resize', onWindowResize);
            setupControls();

            animate();
        }

        function createSpiral() {
            spiralGroup.clear();
            trailGroup.clear();
            cubes = [];
            trailMeshes = [];

            const geometry = new THREE.BoxGeometry(config.cubeSize, config.cubeSize, config.cubeSize);
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(config.count * 3);
            const colors = new Float32Array(config.count * 3);

            for (let i = 0; i < config.count; i++) {
                const t = i / config.count;
                const angle = t * config.turns * Math.PI * 2;
                const height = (t - 0.5) * config.turns * 4;

                const x = Math.cos(angle) * config.radius;
                const y = height;
                const z = Math.sin(angle) * config.radius;

                const color = new THREE.Color();
                color.setHSL(t, 1, 0.6);

                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.4
                });

                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, y, z);
                cube.rotation.set(angle, angle * 0.5, angle * 0.3);
                cube.userData.baseColor = color;
                spiralGroup.add(cube);
                cubes.push(cube);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: config.cubeSize * 3,
                map: particleSprite,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                depthWrite: false
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            particleSystem.visible = false;
            spiralGroup.add(particleSystem);

            document.getElementById('objectCount').textContent = config.count;
        }

        function createTrailFrame() {
            if (!motionBlurEnabled) return;

            const maxTotalTrails = isParticleMode ? 15 : Math.min(config.count * 3, 300);
            if (trailGroup.children.length > maxTotalTrails) {
                const toRemove = trailGroup.children.slice(0, trailGroup.children.length - maxTotalTrails);
                toRemove.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                    trailGroup.remove(child);
                });
            }

            trailGroup.children.forEach(child => {
                if (child.material) {
                    child.material.opacity *= 0.82;
                }
            });

            trailGroup.children = trailGroup.children.filter(child => {
                if (child.material && child.material.opacity < 0.03) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                    return false;
                }
                return true;
            });

            if (isParticleMode) {
                const positions = particleSystem.geometry.attributes.position.array;
                const colors = particleSystem.geometry.attributes.color.array;

                const trailGeo = new THREE.BufferGeometry();
                const trailPositions = new Float32Array(positions.length);
                const trailColors = new Float32Array(colors.length);
                trailPositions.set(positions);
                trailColors.set(colors);

                trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
                trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));

                const trailMat = new THREE.PointsMaterial({
                    size: config.cubeSize * 3,
                    map: particleSprite,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.5,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                    depthWrite: false
                });

                const trailPoints = new THREE.Points(trailGeo, trailMat);
                trailPoints.position.copy(spiralGroup.position);
                trailPoints.rotation.copy(spiralGroup.rotation);
                trailPoints.scale.copy(spiralGroup.scale);
                trailGroup.add(trailPoints);
            } else {
                const step = Math.max(1, Math.floor(config.count / 100));
                for (let i = 0; i < cubes.length; i += step) {
                    const cube = cubes[i];
                    const trailGeo = cube.geometry;
                    const trailMat = new THREE.MeshBasicMaterial({
                        color: cube.userData.baseColor,
                        transparent: true,
                        opacity: 0.3,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const trailMesh = new THREE.Mesh(trailGeo, trailMat);
                    trailMesh.position.copy(cube.getWorldPosition(new THREE.Vector3()));
                    trailMesh.rotation.copy(cube.rotation);
                    trailMesh.scale.copy(cube.scale);
                    trailGroup.add(trailMesh);
                }
            }
        }

        function updateSpiral() {
            const positions = particleSystem.geometry.attributes.position.array;

            for (let i = 0; i < cubes.length; i++) {
                const t = i / config.count;
                const angle = t * config.turns * Math.PI * 2;
                const height = (t - 0.5) * config.turns * 4;

                const x = Math.cos(angle) * config.radius;
                const y = height;
                const z = Math.sin(angle) * config.radius;

                cubes[i].position.set(x, y, z);
                cubes[i].rotation.set(angle, angle * 0.5, angle * 0.3);
                cubes[i].scale.setScalar(config.cubeSize / 0.5);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.material.size = config.cubeSize * 2;
        }

        function setParticleMode(enabled) {
            isParticleMode = enabled;
            for (let cube of cubes) {
                cube.visible = !enabled;
            }
            particleSystem.visible = enabled;
        }

        function setBackground(type) {
            currentBackground = type;

            if (type === 'black') {
                scene.background = new THREE.Color(0x000000);
                if (scene.children.find(c => c.type === 'Points' && c.userData.isStars)) {
                    scene.remove(scene.children.find(c => c.userData.isStars));
                }
            } else if (type === 'darkblue') {
                scene.background = new THREE.Color(0x0a1929);
                if (scene.children.find(c => c.type === 'Points' && c.userData.isStars)) {
                    scene.remove(scene.children.find(c => c.userData.isStars));
                }
            } else if (type === 'starry') {
                createStars();
            }

            document.querySelectorAll('.bg-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.bg === type);
            });
        }

        function createStars() {
            if (scene.children.find(c => c.userData.isStars)) return;

            const starsGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 500;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 500;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 500;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(starsGeometry, starsMaterial);
            stars.userData.isStars = true;
            scene.add(stars);
            scene.background = new THREE.Color(0x000011);
        }

        function takeScreenshot() {
            composer.render();
            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `spiral-screenshot-${Date.now()}.png`;
                link.href = renderer.domElement.toDataURL('image/png');
                link.click();
            }, 50);
        }

        function exportConfig() {
            const exportData = {
                ...config,
                particleMode: isParticleMode,
                autoRotate: autoRotate,
                motionBlur: motionBlurEnabled,
                background: currentBackground
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = `spiral-config-${Date.now()}.json`;
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        function importConfig(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = JSON.parse(e.target.result);

                if (data.radius !== undefined) {
                    config.radius = data.radius;
                    document.getElementById('radius').value = data.radius;
                    document.getElementById('radius-value').textContent = data.radius.toFixed(1);
                }
                if (data.turns !== undefined) {
                    config.turns = data.turns;
                    document.getElementById('turns').value = data.turns;
                    document.getElementById('turns-value').textContent = data.turns.toFixed(1);
                }
                if (data.count !== undefined) {
                    config.count = data.count;
                    document.getElementById('count').value = data.count;
                    document.getElementById('count-value').textContent = data.count;
                    createSpiral();
                }
                if (data.cubeSize !== undefined) {
                    config.cubeSize = data.cubeSize;
                    document.getElementById('size').value = data.cubeSize;
                    document.getElementById('size-value').textContent = data.cubeSize.toFixed(1);
                }
                if (data.particleMode !== undefined) {
                    isParticleMode = data.particleMode;
                    document.getElementById('particleMode').checked = data.particleMode;
                    setParticleMode(data.particleMode);
                }
                if (data.autoRotate !== undefined) {
                    autoRotate = data.autoRotate;
                    document.getElementById('autoRotate').checked = data.autoRotate;
                }
                if (data.motionBlur !== undefined) {
                    motionBlurEnabled = data.motionBlur;
                    document.getElementById('motionBlur').checked = data.motionBlur;
                }
                if (data.background !== undefined) {
                    setBackground(data.background);
                }

                updateSpiral();
            };
            reader.readAsText(file);
        }

        function setupControls() {
            document.getElementById('radius').addEventListener('input', (e) => {
                config.radius = parseFloat(e.target.value);
                document.getElementById('radius-value').textContent = config.radius.toFixed(1);
                updateSpiral();
            });

            document.getElementById('turns').addEventListener('input', (e) => {
                config.turns = parseFloat(e.target.value);
                document.getElementById('turns-value').textContent = config.turns.toFixed(1);
                updateSpiral();
            });

            document.getElementById('count').addEventListener('input', (e) => {
                config.count = parseInt(e.target.value);
                document.getElementById('count-value').textContent = config.count;
                createSpiral();
                setParticleMode(isParticleMode);
            });

            document.getElementById('size').addEventListener('input', (e) => {
                config.cubeSize = parseFloat(e.target.value);
                document.getElementById('size-value').textContent = config.cubeSize.toFixed(1);
                updateSpiral();
            });

            document.getElementById('particleMode').addEventListener('change', (e) => {
                setParticleMode(e.target.checked);
            });

            document.getElementById('autoRotate').addEventListener('change', (e) => {
                autoRotate = e.target.checked;
            });

            document.getElementById('motionBlur').addEventListener('change', (e) => {
                motionBlurEnabled = e.target.checked;
            });

            document.querySelectorAll('.bg-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setBackground(btn.dataset.bg);
                });
            });

            document.getElementById('screenshotBtn').addEventListener('click', takeScreenshot);
            document.getElementById('exportBtn').addEventListener('click', exportConfig);
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });
            document.getElementById('file-input').addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    importConfig(e.target.files[0]);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        let trailFrameCounter = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate) {
                spiralGroup.rotation.y += 0.005;
            }

            if (motionBlurEnabled) {
                trailFrameCounter++;
                if (trailFrameCounter % 2 === 0) {
                    createTrailFrame();
                }
                composer.passes[1].strength = 0.8;
            } else {
                if (trailGroup.children.length > 0) {
                    trailGroup.clear();
                }
                composer.passes[1].strength = 0.6;
            }

            controls.update();
            composer.render();
            updateFPS();
        }

        init();
    </script>
</body>
</html>
