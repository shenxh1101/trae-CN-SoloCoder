<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="4x4井字棋强化版 - 更具挑战性的策略棋类游戏">
    <title>4x4 井字棋强化版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-classic">
    <div class="app-container">
        <header class="game-header">
            <h1 class="game-title">
                <span class="title-icon">⬡</span>
                4x4 井字棋
                <span class="title-badge">强化版</span>
            </h1>
            <p class="game-subtitle">连成四子，挑战智慧极限</p>
        </header>

        <main class="game-main">
            <section class="game-info" aria-label="游戏信息">
                <div class="scoreboard">
                    <div class="score-card player1" id="player1Score">
                        <div class="score-label">
                            <span class="player-mark mark-x">X</span>
                            <span class="player-name">玩家 1</span>
                        </div>
                        <div class="score-value" id="score1">0</div>
                    </div>
                    <div class="score-card draws">
                        <div class="score-label">平局</div>
                        <div class="score-value" id="scoreDraws">0</div>
                    </div>
                    <div class="score-card player2" id="player2Score">
                        <div class="score-label">
                            <span class="player-mark mark-o">O</span>
                            <span class="player-name" id="player2Name">玩家 2</span>
                        </div>
                        <div class="score-value" id="score2">0</div>
                    </div>
                </div>

                <div class="game-status">
                    <div class="current-turn" id="currentTurn">
                        <span class="turn-indicator"></span>
                        <span class="turn-text" id="turnText">玩家 X 的回合</span>
                    </div>
                    <div class="timer-container">
                        <svg class="timer-ring" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                            <circle class="timer-progress" cx="50" cy="50" r="45" id="timerProgress"></circle>
                        </svg>
                        <span class="timer-text" id="timerText">30</span>
                    </div>
                </div>
            </section>

            <section class="game-board-section" aria-label="游戏棋盘">
                <div class="board-container">
                    <div class="board" id="board" role="grid" aria-label="4x4井字棋棋盘">
                        <div class="cell" data-index="0" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="1" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="2" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="3" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="4" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="5" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="6" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="7" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="8" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="9" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="10" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="11" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="12" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="13" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="14" role="gridcell" tabindex="0"></div>
                        <div class="cell" data-index="15" role="gridcell" tabindex="0"></div>
                    </div>
                    <div class="win-overlay" id="winOverlay">
                        <div class="win-content">
                            <div class="win-icon" id="winIcon">🎉</div>
                            <h2 class="win-text" id="winText">玩家 X 获胜！</h2>
                            <button class="btn btn-primary" id="playAgainBtn">再来一局</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="game-controls" aria-label="游戏控制">
                <div class="control-tabs">
                    <button class="tab-btn active" data-tab="game">游戏设置</button>
                    <button class="tab-btn" data-tab="settings">个性化</button>
                </div>

                <div class="tab-content active" id="gameTab">
                    <div class="control-group">
                        <label class="control-label">游戏模式</label>
                        <div class="mode-switcher">
                            <button class="mode-btn active" data-mode="pve">人机对战</button>
                            <button class="mode-btn" data-mode="pvp">双人对战</button>
                        </div>
                    </div>

                    <div class="control-group" id="difficultyGroup">
                        <label class="control-label">AI 难度</label>
                        <div class="difficulty-slider">
                            <input type="range" min="0" max="1" value="0" class="slider" id="difficultySlider">
                            <div class="slider-labels">
                                <span>简单</span>
                                <span>困难</span>
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">先手选择</label>
                        <div class="first-player-switcher">
                            <button class="first-btn active" data-first="1">
                                <span class="player-mark mark-x">X</span>
                                <span id="firstPlayer1Label">玩家</span>
                            </button>
                            <button class="first-btn" data-first="2">
                                <span class="player-mark mark-o">O</span>
                                <span id="firstPlayer2Label">电脑</span>
                            </button>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="undoBtn" disabled>
                            <span class="btn-icon">↶</span>
                            悔棋
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            <span class="btn-icon">↻</span>
                            重置对局
                        </button>
                    </div>
                </div>

                <div class="tab-content" id="settingsTab">
                    <div class="control-group">
                        <label class="control-label">棋盘主题</label>
                        <div class="theme-selector">
                            <button class="theme-card active" data-theme="classic">
                                <div class="theme-preview theme-preview-classic">
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-x"></div>
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-o"></div>
                                </div>
                                <span class="theme-name">经典</span>
                            </button>
                            <button class="theme-card" data-theme="dark">
                                <div class="theme-preview theme-preview-dark">
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-x"></div>
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-o"></div>
                                </div>
                                <span class="theme-name">暗黑</span>
                            </button>
                            <button class="theme-card" data-theme="wood">
                                <div class="theme-preview theme-preview-wood">
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-x"></div>
                                    <div class="preview-cell"></div>
                                    <div class="preview-cell preview-o"></div>
                                </div>
                                <span class="theme-name">木质</span>
                            </button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">
                            音效开关
                            <div class="toggle-switch">
                                <input type="checkbox" id="soundToggle" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </label>
                    </div>

                    <div class="control-group">
                        <button class="btn btn-danger" id="resetScoresBtn">
                            <span class="btn-icon">🗑</span>
                            清空胜场记录
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="game-footer">
            <p>© 2024 4x4井字棋强化版 | 每步限时30秒</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
