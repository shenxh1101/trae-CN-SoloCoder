version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codesandbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codesandbox-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_SOCKET=/var/run/docker.sock
      - CODE_EXECUTION_TIMEOUT=30000
      - MAX_HISTORY_SIZE=50
      - CLIENT_URL=http://localhost:5173
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codesandbox-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  redis-data:
