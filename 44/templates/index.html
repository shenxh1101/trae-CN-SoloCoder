<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询 - Weather App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌤️ 天气查询</h1>
            <div class="unit-toggle">
                <button id="celsiusBtn" class="unit-btn active">°C</button>
                <button id="fahrenheitBtn" class="unit-btn">°F</button>
            </div>
        </header>

        <div id="alarmBanner" class="alarm-banner hidden">
            <span class="alarm-icon">⚠️</span>
            <span id="alarmText">天气预警信息</span>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="输入城市名称..." autocomplete="off">
                <button id="voiceBtn" class="icon-btn" title="语音搜索">🎤</button>
                <button id="searchBtn" class="search-btn">搜索</button>
            </div>
            <div id="searchHistory" class="search-history hidden">
                <span class="history-title">最近搜索：</span>
                <div id="historyList" class="history-list"></div>
            </div>
        </div>

        <div class="favorites-section">
            <h3>⭐ 关注城市</h3>
            <div id="favoritesList" class="favorites-list">
                <span class="empty-text">暂无关注城市</span>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在获取天气信息...</p>
        </div>

        <div id="error" class="error hidden">
            <p id="errorText"></p>
        </div>

        <div id="weatherCard" class="weather-card hidden">
            <div id="weatherContent">
                <div class="weather-header">
                    <div class="city-info">
                        <h2 id="cityName">--</h2>
                        <p id="weatherDesc">--</p>
                    </div>
                    <button id="favoriteBtn" class="icon-btn favorite-btn">☆</button>
                </div>

                <div class="weather-main">
                    <img id="weatherIcon" src="" alt="天气图标" class="weather-icon">
                    <div class="temp-info">
                        <span id="temperature">--</span>
                        <span class="temp-unit">°C</span>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <span class="detail-icon">🌡️</span>
                        <span>体感温度：<span id="feelsLike">--</span>°</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">💧</span>
                        <span>湿度：<span id="humidity">--</span>%</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">💨</span>
                        <span><span id="windDir">--</span> <span id="windSpeed">--</span>km/h</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">🌬️</span>
                        <span>风力：<span id="windScale">--</span>级</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">👁️</span>
                        <span>能见度：<span id="visibility">--</span>km</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">📊</span>
                        <span>气压：<span id="pressure">--</span>hPa</span>
                    </div>
                </div>

                <div class="aqi-section">
                    <h3>空气质量</h3>
                    <div class="aqi-display">
                        <div id="aqiValue" class="aqi-value">--</div>
                        <div class="aqi-info">
                            <span id="aqiCategory" class="aqi-category">--</span>
                            <div class="aqi-details">
                                <span>PM2.5: <span id="pm25">--</span></span>
                                <span>PM10: <span id="pm10">--</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <h3>未来3天预报</h3>
                    <div id="forecastList" class="forecast-list"></div>
                </div>

                <div class="advice-section">
                    <h3>💡 生活建议</h3>
                    <div class="advice-content">
                        <div class="advice-item">
                            <span class="advice-title">👕 穿衣建议</span>
                            <p id="clothingAdvice">--</p>
                        </div>
                        <div class="advice-item">
                            <span class="advice-title">🚗 出行建议</span>
                            <p id="travelAdvice">--</p>
                        </div>
                    </div>
                </div>

                <div class="map-section">
                    <h3>🗺️ 天气地图</h3>
                    <div class="map-container">
                        <iframe id="weatherMap" 
                            src="" 
                            width="100%" 
                            height="300" 
                            frameborder="0" 
                            style="border-radius: 12px;"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="shareBtn" class="action-btn">
                        <span>📤</span> 分享
                    </button>
                    <button id="downloadBtn" class="action-btn">
                        <span>📷</span> 生成图片
                    </button>
                </div>
            </div>
        </div>

        <div id="shareModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>分享天气信息</h3>
                <div id="shareImageContainer">
                    <p>正在生成分享图片...</p>
                </div>
                <div class="modal-buttons">
                    <button id="downloadImageBtn" class="action-btn" disabled>
                        <span>💾</span> 保存图片
                    </button>
                    <button id="nativeShareBtn" class="action-btn">
                        <span>📱</span> 系统分享
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="listeningIndicator" class="listening-indicator hidden">
        <div class="listening-animation">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p>正在聆听...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
