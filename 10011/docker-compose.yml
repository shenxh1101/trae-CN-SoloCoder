version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: shortlink-redis
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: shortlink-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379
    volumes:
      - ./data:/root/data
    restart: always
