<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📚 书签管理器</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="btn btn-secondary" title="切换主题">🌙</button>
                <button id="check-all-btn" class="btn btn-secondary" title="检查所有链接">🔍</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <h3>分类</h3>
                        <button id="add-category-btn" class="btn-icon" title="添加分类">+</button>
                    </div>
                    <ul id="category-list" class="nav-list">
                        <li class="nav-item active" data-filter="all">
                            <span>全部</span>
                            <span id="count-all" class="count-badge">0</span>
                        </li>
                        <li class="nav-item" data-filter="error">
                            <span>⚠️ 失效</span>
                            <span id="count-error" class="count-badge">0</span>
                        </li>
                    </ul>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <h3>标签</h3>
                    </div>
                    <div id="tag-list" class="tag-cloud"></div>
                </div>

                <div class="sidebar-section">
                    <h3>工具</h3>
                    <div class="tool-buttons">
                        <button id="add-bookmark-btn" class="btn btn-primary btn-block">+ 添加书签</button>
                        <button id="import-btn" class="btn btn-secondary btn-block">📥 导入</button>
                        <button id="export-btn" class="btn btn-secondary btn-block">📤 导出</button>
                        <button id="backup-btn" class="btn btn-secondary btn-block">💾 备份</button>
                        <button id="restore-btn" class="btn btn-secondary btn-block">🔄 恢复</button>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="toolbar">
                    <input type="text" id="search-input" placeholder="搜索标题或URL..." class="search-input">
                    <select id="sort-select" class="sort-select">
                        <option value="created_at_desc">时间 (新到旧)</option>
                        <option value="created_at_asc">时间 (旧到新)</option>
                        <option value="title_asc">标题 (A-Z)</option>
                        <option value="title_desc">标题 (Z-A)</option>
                        <option value="clicks_desc">点击 (高到低)</option>
                        <option value="clicks_asc">点击 (低到高)</option>
                    </select>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list" title="列表视图">☰</button>
                        <button class="view-btn" data-view="grid" title="卡片视图">▦</button>
                    </div>
                </div>

                <div id="bookmarks-container" class="bookmarks-list"></div>
                <div id="empty-state" class="empty-state" style="display: none;">
                    <p>暂无书签，点击"添加书签"开始吧！</p>
                </div>
            </main>
        </div>
    </div>

    <div id="bookmark-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">添加书签</h2>
            <form id="bookmark-form">
                <input type="hidden" id="bookmark-id">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="bookmark-title" required placeholder="输入书签标题">
                </div>
                <div class="form-group">
                    <label>URL</label>
                    <input type="url" id="bookmark-url" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="bookmark-category"></select>
                </div>
                <div class="form-group">
                    <label>标签 (逗号分隔)</label>
                    <input type="text" id="bookmark-tags" placeholder="标签1, 标签2">
                </div>
                <button type="submit" class="btn btn-primary btn-block">保存</button>
            </form>
        </div>
    </div>

    <div id="category-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="category-modal-title">管理分类</h2>
            <div class="category-manage">
                <div class="form-row">
                    <input type="text" id="new-category-name" placeholder="新分类名称">
                    <button id="add-category-confirm" class="btn btn-primary">添加</button>
                </div>
                <ul id="manage-category-list" class="manage-list"></ul>
            </div>
        </div>
    </div>

    <div id="backup-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>备份与恢复</h2>
            <div class="backup-actions">
                <button id="create-backup-btn" class="btn btn-primary">创建备份</button>
            </div>
            <h3>备份列表</h3>
            <ul id="backup-list" class="manage-list"></ul>
        </div>
    </div>

    <div id="import-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>导入书签</h2>
            <p class="modal-hint">支持 Chrome 和 Firefox 导出的 HTML 书签文件</p>
            <input type="file" id="import-file" accept=".html" class="file-input">
            <button id="import-confirm-btn" class="btn btn-primary btn-block">导入</button>
            <div id="import-result" class="import-result"></div>
        </div>
    </div>

    <div id="share-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>生成分享页面</h2>
            <div class="form-group">
                <label>选择分享类型</label>
                <select id="share-type">
                    <option value="category">按分类</option>
                    <option value="tag">按标签</option>
                </select>
            </div>
            <div class="form-group">
                <label>选择值</label>
                <select id="share-value"></select>
            </div>
            <button id="create-share-btn" class="btn btn-primary btn-block">生成分享链接</button>
            <div id="share-result" class="share-result"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
