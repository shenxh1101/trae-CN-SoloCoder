<!-- Usage Example -->
<!DOCTYPE html>
<html>
<head>
  <title>BlueButton Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; background: #f5f5f5; }
    .container { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <!-- BlueButton Component -->
<style>
  .bluebutton {
    padding: 12px 24px; font-size: 16px;
    background-color: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
    
    
  }
  .bluebutton:hover:not(:disabled) {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .bluebutton:active:not(:disabled) {
    transform: translateY(0);
  }
  .bluebutton:focus {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
  }
  .bluebutton:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .bluebutton-icon {
    display: inline-flex;
    align-items: center;
  }
</style>

<button class="bluebutton"  aria-label="Click Me">
  
  <span class="bluebutton-text">Click Me</span>
</button>
  </div>
</body>
</html>
