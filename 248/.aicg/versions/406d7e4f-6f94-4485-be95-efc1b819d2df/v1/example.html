<!DOCTYPE html>
<html>
<head><title>AIGeneratedButton Demo</title></head>
<body>
  <div style="padding: 20px;">
    <!-- AIGeneratedButton Component - AI Generated -->
<style>
  .aigeneratedbutton {
    padding: 12px 24px;
    font-size: 16px;
    background-color: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
  }
  .aigeneratedbutton:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .aigeneratedbutton:focus {
    outline: 2px solid #60a5fa;
    outline-offset: 2px;
  }
  .aigeneratedbutton:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>

<button class="aigeneratedbutton" aria-label="Click Me" onclick="alert('Button clicked!')">
  <span>Click Me</span>
</button>
  </div>
</body>
</html>
