<!-- Usage Example -->
<!DOCTYPE html>
<html>
<head>
  <title>YellowButton Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; background: #f5f5f5; }
    .container { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <!-- YellowButton Component -->
<style>
  .yellowbutton {
    padding: 12px 24px; font-size: 16px;
    background-color: #eab308;
    color: white;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
    
    
  }
  .yellowbutton:hover:not(:disabled) {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .yellowbutton:active:not(:disabled) {
    transform: translateY(0);
  }
  .yellowbutton:focus {
    outline: 2px solid #eab308;
    outline-offset: 2px;
  }
  .yellowbutton:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .yellowbutton-icon {
    display: inline-flex;
    align-items: center;
  }
</style>

<button class="yellowbutton"  aria-label="Click Me">
  <span class="yellowbutton-icon"><svg width="16px" height="16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: block;">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg></span>
  <span class="yellowbutton-text">Click Me</span>
</button>
  </div>
</body>
</html>
