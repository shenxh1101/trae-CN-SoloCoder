{% extends "base.html" %}

{% block title %}AI面试官模拟器 - 开始面试{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl card-shadow max-w-2xl w-full p-8">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="text-4xl">🤖</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">AI面试官模拟器</h1>
            <p class="text-gray-500">提升你的面试技巧，随时准备迎接挑战</p>
        </div>

        <form id="interviewForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">选择岗位类型</label>
                <select id="position" name="position" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                    <option value="">请选择岗位...</option>
                    {% for pos in positions %}
                    <option value="{{ pos }}">{{ pos }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">难度级别</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-400 transition has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50">
                        <input type="radio" name="difficulty" value="junior" checked class="w-4 h-4 text-purple-600">
                        <div class="ml-3">
                            <div class="font-medium text-gray-800">🌱 初级</div>
                            <div class="text-sm text-gray-500">基础概念和常见问题</div>
                        </div>
                    </label>
                    <label class="flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-400 transition has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50">
                        <input type="radio" name="difficulty" value="senior" class="w-4 h-4 text-purple-600">
                        <div class="ml-3">
                            <div class="font-medium text-gray-800">🔥 高级</div>
                            <div class="text-sm text-gray-500">深入原理和系统设计</div>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-400 transition has-[:checked]:border-red-400 has-[:checked]:bg-red-50">
                    <input type="checkbox" id="pressure_mode" name="pressure_mode" class="w-4 h-4 text-red-600">
                    <div class="ml-3">
                        <div class="font-medium text-gray-800">⚡ 压力面试模式</div>
                        <div class="text-sm text-gray-500">每题限时作答，模拟真实面试紧张感</div>
                    </div>
                </label>
            </div>

            <div id="timeSettings" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-2">每题答题时间（秒）</label>
                <input type="number" id="time_per_question" name="time_per_question" value="120" min="30" max="600" step="10"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">自定义题库（可选）</label>
                <div class="flex items-center space-x-4">
                    <input type="file" id="customFile" name="customFile" accept=".json"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200 transition">
                    <span id="fileStatus" class="text-sm text-gray-500"></span>
                </div>
                <p class="mt-1 text-xs text-gray-400">上传JSON格式的自定义题库，格式参考文档</p>
            </div>

            <button type="submit" id="startBtn"
                class="w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold rounded-xl hover:from-purple-700 hover:to-indigo-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg">
                🚀 开始面试
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <div class="grid grid-cols-3 gap-4 text-center text-sm">
                <div>
                    <div class="text-2xl mb-1">📝</div>
                    <div class="text-gray-600">5道精选题目</div>
                </div>
                <div>
                    <div class="text-2xl mb-1">💡</div>
                    <div class="text-gray-600">智能评估反馈</div>
                </div>
                <div>
                    <div class="text-2xl mb-1">📊</div>
                    <div class="text-gray-600">详细报告分析</div>
                </div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="{{ url_for('admin_login') }}" class="text-sm text-gray-400 hover:text-purple-600 transition">管理员登录</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let customBankId = null;

    document.getElementById('pressure_mode').addEventListener('change', function() {
        document.getElementById('timeSettings').classList.toggle('hidden', !this.checked);
    });

    document.getElementById('customFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        document.getElementById('fileStatus').textContent = '上传中...';
        
        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (data.success) {
                customBankId = data.custom_bank_id;
                document.getElementById('fileStatus').textContent = `✅ 已导入${data.count}道题`;
                document.getElementById('fileStatus').className = 'text-sm text-green-600';
            } else {
                document.getElementById('fileStatus').textContent = `❌ ${data.error}`;
                document.getElementById('fileStatus').className = 'text-sm text-red-600';
            }
        } catch (error) {
            document.getElementById('fileStatus').textContent = '❌ 上传失败';
            document.getElementById('fileStatus').className = 'text-sm text-red-600';
        }
    });

    document.getElementById('interviewForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const position = document.getElementById('position').value;
        const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
        const pressure_mode = document.getElementById('pressure_mode').checked;
        const time_per_question = parseInt(document.getElementById('time_per_question').value) || 120;

        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;
        startBtn.innerHTML = '⏳ 正在准备面试...';

        try {
            const response = await fetch('/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    position,
                    difficulty,
                    pressure_mode,
                    time_per_question,
                    custom_bank_id: customBankId
                })
            });

            const data = await response.json();
            
            if (response.ok) {
                localStorage.setItem('interviewData', JSON.stringify(data));
                window.location.href = '/interview';
            } else {
                alert(data.error || '启动面试失败');
                startBtn.disabled = false;
                startBtn.innerHTML = '🚀 开始面试';
            }
        } catch (error) {
            alert('网络错误，请稍后重试');
            startBtn.disabled = false;
            startBtn.innerHTML = '🚀 开始面试';
        }
    });
</script>
{% endblock %}
