{% extends "base.html" %}

{% block title %}删除文本 - 文本粘贴服务{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="font-size: 64px; margin-bottom: 20px;">🗑️</div>
        <h2>删除文本</h2>
        <p style="color: #666;">请输入访问码和删除密钥</p>
    </div>
    
    <form method="POST">
        <div class="form-group">
            <label for="code">访问码</label>
            <input type="text" id="code" name="code" placeholder="例如: abc123" required>
        </div>
        <div class="form-group">
            <label for="delete_key">删除密钥</label>
            <input type="text" id="delete_key" name="delete_key" placeholder="创建时生成的16位密钥" required>
        </div>
        <button type="submit" class="btn btn-danger" style="width: 100%;">确认删除</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #667eea; text-decoration: none;">返回首页</a>
    </div>
</div>
{% endblock %}
