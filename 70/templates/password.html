{% extends "base.html" %}

{% block title %}需要密码 - 文本粘贴服务{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; text-align: center;">
    <div style="font-size: 64px; margin-bottom: 20px;">🔒</div>
    <h2 style="margin-bottom: 20px;">该文本受密码保护</h2>
    <p style="color: #666; margin-bottom: 30px;">请输入阅读密码以查看内容</p>
    
    <form method="POST">
        <div class="form-group">
            <input type="password" name="password" placeholder="请输入密码" required autofocus>
        </div>
        <button type="submit" class="btn">确认访问</button>
    </form>
</div>
{% endblock %}
