<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 100%; padding: 40px; }
        h1 { color: #333; margin-bottom: 8px; font-size: 22px; text-align: center; }
        .subtitle { color: #888; margin-bottom: 28px; font-size: 13px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 14px; }
        input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; outline: none; }
        input[type="password"]:focus { border-color: #667eea; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .flash-error { background: #fee; color: #c33; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; border: 1px solid #fcc; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #667eea; font-size: 13px; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>管理员登录</h1>
        <p class="subtitle">请输入管理员密码进入后台</p>
        {% with messages = get_flashed_messages(category_filter=['error']) %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash-error">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" name="password" placeholder="请输入密码" required autofocus>
            </div>
            <button type="submit">登录</button>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">返回首页</a>
    </div>
</body>
</html>
