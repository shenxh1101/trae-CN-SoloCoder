<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 50px 40px; text-align: center; }
        .check-icon { width: 80px; height: 80px; background: #4CAF50; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 24px; }
        .check-icon::before { content: ''; width: 34px; height: 18px; border-left: 5px solid #fff; border-bottom: 5px solid #fff; transform: rotate(-45deg) translate(3px, -6px); }
        h1 { color: #333; margin-bottom: 12px; font-size: 24px; }
        .success-msg { color: #666; margin-bottom: 28px; font-size: 15px; }
        .query-box { background: #f5f5fa; border: 2px dashed #667eea; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
        .query-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .query-code { font-size: 28px; font-weight: bold; color: #667eea; letter-spacing: 2px; }
        .tips { background: #fffbe6; border-radius: 8px; padding: 14px; font-size: 13px; color: #876800; margin-bottom: 24px; text-align: left; }
        .btn { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; text-decoration: none; margin: 0 6px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-secondary:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div class="container">
        <div class="check-icon"></div>
        <h1>反馈提交成功！</h1>
        <p class="success-msg">感谢您的反馈，我们会认真对待每一条建议</p>
        <div class="query-box">
            <div class="query-label">您的查询码</div>
            <div class="query-code">{{ query_code }}</div>
        </div>
        <div class="tips">请妥善保存此查询码，您可以通过查询码随时查看反馈的处理状态</div>
        <a href="{{ url_for('query') }}?code={{ query_code }}" class="btn">查询状态</a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">返回首页</a>
    </div>
</body>
</html>
